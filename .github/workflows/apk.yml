# Gera o APK Android do Sintonia.
# O APK abre o site publicado no GitHub Pages, então atualizações do app e dos dados
# chegam sozinhas — só é preciso gerar um APK novo se mudar nome, ícone ou config.
# O APK fica na Release "apk" do repositório (link fixo para baixar no celular).
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar projeto Android (Capacitor)
        working-directory: android-shell
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # notificações só entram no APK quando o Firebase está configurado (segredo GOOGLE_SERVICES_JSON)
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Firebase não configurado: APK sem notificações"
            node -e "const f='package.json';const p=require('./'+f);delete p.dependencies['@capacitor/push-notifications'];delete p.dependencies['@capacitor-community/fcm'];require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER_LC}.github.io/${REPO}/"
          echo "O app vai abrir: $URL"
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.server.url=process.argv[1];c.server.allowNavigation=[new URL(process.argv[1]).host,'accounts.spotify.com','*.spotify.com','*.scdn.co','challenge.spotify.com'];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$URL"
          npm install
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "const j=require('./android/app/google-services.json');const ok=j.client.some(c=>c.client_info.android_client_info.package_name==='app.sintonia.streams');if(!ok){console.error('google-services.json não tem o pacote app.sintonia.streams');process.exit(1)}console.log('Firebase:',j.project_info.project_id)"
          fi
          (npm run icon && npx capacitor-assets generate --android) || echo "usando ícone padrão"
          npx cap sync android

      - name: Plugin nativo (músicas do celular) e permissões
        working-directory: android-shell/android
        run: |
          SRC=app/src/main/java/app/sintonia/streams
          cp ../native/MainActivity.java ../native/LocalAudioPlugin.java "$SRC/"
          M=app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"
          grep -q READ_MEDIA_AUDIO "$M" || { echo "permissão não adicionada"; exit 1; }
          cat "$M"

      - name: Chave de assinatura fixa e número de versão
        # Sem chave fixa, cada build sai com uma assinatura diferente e o Android
        # recusa instalar por cima. A chave (de debug) é gerada uma vez e salva no repositório.
        run: |
          KS=android-shell/keystore/debug.keystore
          if [ ! -f "$KS" ]; then
            mkdir -p android-shell/keystore
            keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "sintonia-bot"; git config user.email "sintonia-bot@users.noreply.github.com"
            git add "$KS"; git commit -m "Chave fixa de assinatura do APK"; git pull --rebase --autostash -q; git push -q
          fi
          mkdir -p ~/.android; cp "$KS" ~/.android/debug.keystore
          G=android-shell/android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n 'versionCode\|versionName' "$G"

      - name: Compilar APK
        working-directory: android-shell/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar na Release "apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-shell/android/app/build/outputs/apk/debug/app-debug.apk Sintonia.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Sintonia.apk --title "Sintonia (APK)" --notes "Baixe Sintonia.apk no celular e instale (permita 'fontes desconhecidas'). Gerado em $(date -u +'%d/%m/%Y %H:%M') UTC."
