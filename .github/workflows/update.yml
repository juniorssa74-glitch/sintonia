# Coleta os streams (kworb.net) a cada 3 horas, salva o histórico no repositório
# e publica o site no GitHub Pages. Também processa pedidos de "Acompanhar"/"Remover"
# artista feitos pelo app (via issue aberta pelo dono do repositório).
name: Coletar streams e publicar

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "lib/**", "scripts/**", ".github/workflows/update.yml"]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  collect:
    # issues só contam se foram abertas pelo dono do repositório
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Coletar e gerar dados
        id: collect
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node scripts/collect.js

      - name: Salvar histórico no repositório
        run: |
          git config user.name "sintonia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "sem mudanças"; else
            git commit -m "dados: coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi

      - name: Responder e fechar a issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.collect.outcome == 'success' }}
        run: |
          if [ "$OK" = "true" ]; then MSG="Feito! Os dados já estão no app (pode levar 1-2 min para o site atualizar)."; else MSG="Não consegui processar esse pedido — o artista existe no kworb.net? Veja o log da execução."; fi
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "$MSG"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
