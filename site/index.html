    <h1 style="margin-bottom:8px">Chave do GitHub</h1>
    <p class="sub" style="line-height:1.55;margin-bottom:16px">Com ela, o app ${pending ? `${pending.action === 'Remover' ? 'remove' : 'adiciona'} <b>${esc(pending.name)}</b>` : 'adiciona e remove artistas'} sozinho, sem abrir o GitHub. A chave fica salva só neste aparelho.</p>
    ${bad ? `<p class="note" style="color:var(--bad);font-weight:700;margin-bottom:12px">A chave salva não funcionou (expirou ou está sem permissão). Crie outra.</p>` : ''}
    <div class="kpi" style="gap:12px;margin-bottom:14px">
      <b style="font-size:15px">Como criar (1 minuto)</b>
      <ol style="margin:0 0 0 18px;line-height:1.6;font-size:13px;color:var(--muted)">
        <li>Toque em <b>Criar chave no GitHub</b>. A página abre já preenchida.</li>
        <li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque <b>${esc(repo)}</b>.</li>
        <li>Em <b>Permissions</b>, confira <b>Issues: Read and write</b>.</li>
        <li>Toque em <b>Generate token</b>, copie o código (começa com <code>github_pat_</code>) e cole abaixo.</li>
      </ol>
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;padding:12px">Criar chave no GitHub</a>
    </div>
    <label for="ghtok" class="note" style="font-weight:700;display:block;margin-bottom:4px">Cole a chave aqui</label>
    <input class="filter" id="ghtok" type="password" autocomplete="off" placeholder="github_pat_…" style="margin-top:0">
    <button class="btn" id="ghsave" style="width:100%;height:48px;border-radius:14px;margin-top:4px">Salvar${pending ? ' e continuar' : ''}</button>
    ${pending ? `<button class="btn ghost" id="ghweb" style="width:100%;height:44px;border-radius:14px;margin-top:10px">Agora não: abrir o GitHub desta vez</button>` : ''}
    ${has ? `<button class="btn ghost" id="ghdel" style="width:100%;height:44px;border-radius:14px;margin-top:10px;color:var(--bad)">Apagar a chave deste aparelho</button>` : ''}
    <p class="note" id="ghmsg" style="margin-top:12px"></p>`;
  $('#ghsave').onclick = async () => {
    const tok = $('#ghtok').value.trim();
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(tok)) { $('#ghmsg').textContent = 'Isso não parece uma chave do GitHub (começa com github_pat_).'; return; }
    $('#ghmsg').textContent = 'Conferindo…';
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { Authorization: `Bearer ${tok}`, Accept: 'application/vnd.github+json' } });
      if (!r.ok) { $('#ghmsg').textContent = r.status === 404 ? `A chave não tem acesso ao repositório ${repo}. Marque-o em Repository access.` : 'O GitHub recusou a chave. Confira se copiou inteira.'; return; }
    } catch { $('#ghmsg').textContent = 'Sem conexão com o GitHub agora.'; return; }
    store.set(GH_KEY, tok); toast('Chave salva neste aparelho');
    back();
    if (pending) issueLink(pending.action, pending.id, pending.name);
  };
  if ($('#ghweb')) $('#ghweb').onclick = () => { back(); issueOpen(pending.action, pending.id, pending.name); };
  if ($('#ghdel')) $('#ghdel').onclick = () => { try { localStorage.removeItem(GH_KEY); } catch {} toast('Chave apagada'); back(); };
};

/* =================== PRÊMIOS (AWARDS) =================== */
// Fonte: Wikipédia em inglês ("List of awards and nominations received by …"), coletada pelo GitHub Actions.
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const AW_TYPE = {artist:'Artista', album:'Álbum', song:'Música', cert:'Certificação', honor:'Reconhecimento', other:'Outros'};
const AW_GROUP = {year:'Ano', award:'Prêmio', work:'Obra'};
const TROPHY = '<svg class="ln" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:2.2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
function awMono(name){
  const words = name.replace(/[^\p{L}\p{N} ]/gu, ' ').split(/\s+/).filter(w => w && !/^(the|of|de|do|da|and|e|awards?|music|prêmio|premios?)$/i.test(w));
  const ini = (words.slice(0, 2).map(w => w[0]).join('') || name[0] || '?').toUpperCase();
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<span class="awimg mono" style="background:hsl(${h} 45% 92%);color:hsl(${h} 45% 28%)" aria-hidden="true">${esc(ini)}</span>`;
}
const EX_TYPE = {award:'Prêmio', cert:'Certificação', honor:'Reconhecimento'};
function awImg(d, award, r){
  if (r?.img) return `<span class="awimg photo"><img src="${esc(r.img)}" alt="" loading="lazy" onerror="this.parentNode.outerHTML=awMono(${esc(JSON.stringify(award))})"></span>`;
  const u = d.awards[award]?.img;
  return u ? `<span class="awimg"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.outerHTML=awMono(${esc(JSON.stringify(award))})"></span>` : awMono(award);
}

Screens.awards = async function(_, alive){
  view.innerHTML = `<span class="kicker">Prêmios</span><h1 style="font-size:28px;margin-bottom:16px">Awards</h1>${phRows(5)}`;
  let sum;
  try { sum = await dataJSON('summary.json'); } catch { if (alive()) view.innerHTML += '<p class="empty">Sem dados ainda.</p>'; return; }
  if (!alive()) return;
  const artists = sum.artists;
  if (!artists.length) { view.innerHTML = `<span class="kicker">Prêmios</span><h1>Awards</h1><p class="empty">Acompanhe um artista na aba Streams para ver os prêmios dele.</p>`; return; }
  let aid = store.get('awArtist', artists[0].id); if (!artists.some(a => a.id === aid)) aid = artists[0].id;
  const st = { res: 'all', group: store.get('awGroup', 'year'), type: 'all', q: '', limit: 120, src: 'wiki' };
  let d = null;

  const shell = () => {
    view.innerHTML = `
      <div class="top" style="margin-bottom:14px"><div style="flex:1"><span class="kicker">Prêmios</span><h1 style="font-size:28px">Awards</h1></div>
        <button class="btn" id="awImg" style="display:flex;align-items:center;gap:6px;height:40px" hidden>${I.img.replace('<svg', '<svg style="width:16px;height:16px"')}Criar imagem</button></div>
      <div class="chips" id="awA" style="margin-bottom:16px">${artists.map(a => `<button class="chip ${a.id===aid?'on':''}" data-a="${a.id}">${esc(a.name)}</button>`).join('')}</div>
      <div id="awBody">${phRows(5)}</div>`;
    $('#awA').onclick = e => { const b = e.target.closest('[data-a]'); if (!b || b.dataset.a === aid) return; aid = b.dataset.a; store.set('awArtist', aid); st.type = 'all'; st.q = ''; st.limit = 120; st.src = 'wiki'; st.res = 'all'; load(); };
  };
  const load = async () => {
    shell();
    try { d = await dataJSON(`awards/${aid}.json`); } catch { d = null; }
    if (!alive()) return;
    if (!d || !d.rows.length) { $('#awBody').innerHTML = `<p class="empty">Ainda não encontramos a lista de prêmios deste artista na Wikipédia.<br>Ela é buscada a cada coleta; artistas novos aparecem em até 1 hora.</p>`; return; }
    const art = artists.find(a => a.id === aid);
    $('#awImg').hidden = false;
    $('#awImg').onclick = () => go({type:'share', src:{ kind:'awards', title: d.artistName, img: art?.img, rows: d.rows, awards: d.awards, lastDate: (d.fetchedAt || '').slice(0, 10) }});
    paint();
  };
  const paint = () => {
    const ex = null, rows = d.rows, TYPES = AW_TYPE, GROUPS = AW_GROUP;
    const awardsN = new Set(rows.map(r => r.a)).size;
    const tc = {}; rows.forEach(r => tc[r.t] = (tc[r.t] || 0) + 1);
    const q = norm(st.q);
    const f = rows.filter(r => (st.res === 'all' || (st.res === 'won' ? r.r === 'won' : r.r !== 'won'))
      && (st.type === 'all' || r.t === st.type)
      && (!q || norm(`${r.a} ${r.c} ${r.n} ${r.y}`).includes(q)));
    const key = r => st.group === 'year' ? String(r.y || 'Sem ano') : st.group === 'award' ? r.a : ex ? TYPES[r.t] : (r.t === 'artist' ? d.artistName : r.n || '—');
    const groups = new Map();
    for (const r of f) { const k = key(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
    let order = [...groups.entries()];
    if (st.group === 'year') order.sort((a, b) => (parseInt(b[0]) || 0) - (parseInt(a[0]) || 0));
    else order.sort((a, b) => b[1].filter(r => r.r === 'won').length - a[1].filter(r => r.r === 'won').length || b[1].length - a[1].length || a[0].localeCompare(b[0]));
    let shown = 0;
    const html = order.map(([k, list]) => {
      if (shown >= st.limit) return '';
      const w = list.filter(r => r.r === 'won').length;
      const cnt = (w, n) => ex ? `${n} ${n===1?'item':'itens'} no acervo` : st.res === 'won' ? `${w} ${w===1?'vitória':'vitórias'}` : st.res === 'nom' ? `${n} ${n===1?'indicação':'indicações'}` : `${w} ${w===1?'vitória':'vitórias'} em ${n} ${n===1?'indicação':'indicações'}`;
      const head = st.group === 'award'
        ? `<div class="awgh">${awImg(d, k, ex ? list.find(r => r.img) : null)}<div class="t"><b>${esc(k)}</b><i>${cnt(w, list.length)}</i></div></div>`
        : `<div class="awgh plain"><b>${esc(k)}</b>${!ex && st.group === 'work' && list[0].t !== 'artist' ? `<span class="awtype">${AW_TYPE[list[0].t]}</span>` : ''}<i>${cnt(w, list.length)}</i></div>`;
      const items = list.slice().sort((a, b) => (b.y || 0) - (a.y || 0) || (a.r === 'won' ? -1 : 1)).slice(0, Math.max(0, st.limit - shown));
      shown += items.length;
      const sub = r => ex
        ? [st.group === 'award' ? '' : (r.c ? r.a : ''), st.group === 'year' ? '' : r.y].filter(Boolean)
        : [st.group === 'award' || r.a === r.c ? '' : r.a, st.group === 'year' ? '' : r.y, st.group === 'work' ? '' : (r.t === 'artist' ? '' : r.n)].filter(Boolean);
      const badge = r => ex ? `<span class="awres ${r.t === 'award' ? 'won' : ''}">${r.t === 'award' ? TROPHY : ''}${EX_TYPE[r.t]}</span>`
        : r.t === 'cert' || r.t === 'honor' ? `<span class="awres won">${TROPHY}${AW_TYPE[r.t]}</span>` : r.r === 'won' ? `<span class="awres won">${TROPHY}Venceu</span>` : `<span class="awres">${r.r === 'nominated' ? 'Indicação' : esc(r.rt || 'Outro')}</span>`;
      return `<section class="awg">${head}<div class="awlist">${items.map(r => `
        <${r.link ? `a href="${esc(r.link)}" target="_blank" rel="noopener"` : 'div'} class="awrow">
          ${st.group === 'award' && !ex ? '' : awImg(d, r.a, r)}
          <div class="t"><b>${esc(r.c || r.a)}</b><i>${sub(r).map(esc).join(' · ')}</i></div>
          ${badge(r)}
        </${r.link ? 'a' : 'div'}>`).join('')}</div></section>`;
    }).join('');
    const exN = k => rows.filter(r => r.t === k).length;
    $('#awBody').innerHTML = `
      ${ex ? `<div class="awsum">
        <div class="kpi"><span>Prêmios</span><b style="color:var(--accent)">${nf.format(exN('award'))}</b></div>
        <div class="kpi"><span>Certificações</span><b>${nf.format(exN('cert'))}</b></div>
        <div class="kpi"><span>Reconhec.</span><b>${nf.format(exN('honor'))}</b></div>
      </div>` : `<div class="awsum">
        <div class="kpi"><span>Vitórias</span><b style="color:var(--accent)">${nf.format(d.won)}</b></div>
        <div class="kpi"><span>No total</span><b>${nf.format(d.total)}</b></div>
        <div class="kpi"><span>Premiações</span><b>${nf.format(awardsN)}</b></div>
      </div>
      <p class="note" style="margin:-6px 0 14px">${nf.format(d.total - d.won)} indicações sem vitória${tc.cert ? ` · inclui ${tc.cert} certificações (discos de ouro/platina)` : ''}${tc.honor ? ` e ${tc.honor} reconhecimentos` : ''}</p>
      <div class="seg" id="awR" role="tablist" aria-label="Resultado">${[['all','Todos'],['won','Vitórias'],['nom','Só indicações']].map(([k,l]) => `<button role="tab" data-v="${k}" class="${st.res===k?'on':''}">${l}</button>`).join('')}</div>`}
      <div style="display:flex;align-items:center;gap:8px;margin:${ex ? '0' : '-4px'} 0 12px"><span class="note" style="font-weight:700">Agrupar por</span>
        <div class="chips" id="awG">${Object.entries(GROUPS).map(([k,l]) => `<button class="chip ${st.group===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div></div>
      <div class="chips" id="awT" style="margin-bottom:4px">${[['all','Tudo', rows.length], ...Object.entries(TYPES).filter(([k]) => tc[k]).map(([k,l]) => [k, l, tc[k]])].map(([k,l,n]) => `<button class="chip ${st.type===k?'on':''}" data-v="${k}">${l} · ${n}</button>`).join('')}</div>
      <input class="filter" id="awQ" placeholder="Buscar prêmio, categoria, música, ano…" value="${esc(st.q)}" aria-label="Buscar nos prêmios">
      <div id="awL">${html || '<p class="empty">Nada encontrado com esses filtros.</p>'}</div>
      ${f.length > st.limit ? `<button class="btn ghost" id="awMore" style="width:100%;height:44px;border-radius:14px;margin-top:8px">Mostrar mais (${f.length - st.limit})</button>` : ''}
      <p class="note" style="margin-top:18px;line-height:1.6">Prêmios reunidos de ${(d.sources || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>${x.license ? ` (${x.license})` : ''}`).join(' e ')}. O mesmo prêmio em mais de um lugar conta uma vez só. Categorias da Wikipédia em inglês. Atualizado em ${new Date(d.fetchedAt).toLocaleDateString('pt-BR')}.</p>`;
    const seg = (sel, k, persist) => $(sel) && ($(sel).onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; st[k] = b.dataset.v; if (persist) store.set(persist, st[k]); st.limit = 120; if (k === 'src') st.type = 'all'; paint(); });
    seg('#awR', 'res'); seg('#awG', 'group', 'awGroup'); seg('#awT', 'type'); seg('#awS', 'src');
    const qi = $('#awQ'); let t;
    qi.oninput = () => { clearTimeout(t); t = setTimeout(() => { st.q = qi.value; st.limit = 120; paint(); const n = $('#awQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
    if ($('#awMore')) $('#awMore').onclick = () => { st.limit += 200; paint(); };
  };
  load();
};

/* =================== MÚSICAS DO CELULAR =================== */
// No APK: plugin nativo "LocalAudio" lista os áudios do aparelho (MediaStore), já sem WhatsApp.
// No navegador: o usuário escolhe os arquivos; nomes típicos do WhatsApp são descartados.
const LOCAL_ART = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1d3b29"/><path d="M40 28v34.5a10 10 0 1 0 6 9.2V40l22-5v20.5a10 10 0 1 0 6 9.2V22z" fill="#3ddc6f"/></svg>');
function capPlugin(name){
  const C = window.Capacitor;
  if (!C?.isNativePlatform?.()) return null;
  capPlugin.cache ??= {};
  return capPlugin.cache[name] ??= (C.registerPlugin ? C.registerPlugin(name) : C.Plugins?.[name] || null);
}
const isWhatsApp = s => /whatsapp|com\.whatsapp|^(ptt|aud)-\d{8}-wa\d+/i.test(s);
S.localTracks = null;
function localItem(t){ return { kind:'local', id:'l'+t.id, title:t.title, sub:[t.artist, t.album].filter(Boolean).join(' · ') || 'No celular', art:LOCAL_ART, url:t.url, dur:t.duration/1000 }; }

Screens.local = async function(_, alive){
  const native = capPlugin('LocalAudio');
  const paint = () => {
    const list = S.localTracks || [];
    view.innerHTML = `
      <button class="back" onclick="back()">${I.back}</button>
      <h1>Músicas do celular</h1>
      <div class="sub" style="margin:4px 0 12px">${S.localTracks ? `${list.length} arquivos · áudios do WhatsApp ficam de fora` : 'Toque abaixo para ler os áudios do aparelho'}</div>
      <div class="actions">
        ${native ? `<button class="btn" id="scan">${S.localTracks ? 'Atualizar lista' : 'Ler músicas do celular'}</button>`
                 : `<label class="btn" style="cursor:pointer">Escolher arquivos<input type="file" id="pick" accept="audio/*" multiple hidden></label>`}
        ${list.length ? `<button class="bigplay" id="pa">${I.play}</button>` : ''}
      </div>
      ${list.length > 8 ? `<input class="filter" id="lf" placeholder="Filtrar por nome, artista ou álbum…">` : ''}
      <div id="ll">${list.length ? '' : `<p class="empty">${native ? 'O app vai pedir permissão para acessar músicas e áudios.' : 'No navegador, escolha os arquivos de áudio. No app (APK), a lista é lida automaticamente.'}</p>`}</div>`;
    const items = list.map(localItem);
    const rows = q => {
      const f = items.map((s,i) => [s,i]).filter(([s]) => !q || (s.title+' '+s.sub).toLowerCase().includes(q.toLowerCase())).slice(0, 400);
      $('#ll').innerHTML = f.map(([s,i]) => `<div class="row" data-play="${i}"><img src="${s.art}" alt=""><div class="t"><b data-pid="${s.id}" class="${S.cur?.id===s.id?'playing':''}">${esc(s.title)}</b><i>${esc(s.sub)} · ${fmt(s.dur)}</i></div></div>`).join('');
    };
    if (list.length) { rows(''); $('#ll').onclick = e => { const b = e.target.closest('[data-play]'); if (b) playQueue(items, +b.dataset.play, 'Músicas do celular'); }; $('#pa').onclick = () => playQueue(items, 0, 'Músicas do celular'); }
    if ($('#lf')) $('#lf').oninput = e => rows(e.target.value);
    if ($('#scan')) $('#scan').onclick = async () => {
      $('#scan').textContent = 'Lendo…';
      try {
        const r = await native.list();
        S.localTracks = r.items.filter(t => !isWhatsApp(t.path || '') && !isWhatsApp(t.name || ''))
          .map(t => ({ ...t, url: window.Capacitor.convertFileSrc(t.path) }));
        if (alive()) paint();
      } catch (e) { toast(/perm/i.test(e.message) ? 'Permissão negada nas configurações do Android' : 'Não foi possível ler as músicas'); if (alive()) paint(); }
    };
    if ($('#pick')) $('#pick').onchange = e => {
      const files = [...e.target.files].filter(f => !isWhatsApp(f.name));
      (S.localTracks || []).forEach(t => t.blob && URL.revokeObjectURL(t.url));
      S.localTracks = files.map((f, i) => ({ id: 'f'+i+f.size, title: f.name.replace(/\.[^.]+$/, ''), artist:'', album:'', duration:0, url: URL.createObjectURL(f), blob:true }));
      paint();
    };
  };
  paint();
  if (native && !S.localTracks) $('#scan').click();
};

function spark(pts){
  if (!pts || pts.length < 2) return '';
  const W = 70, H = 30, max = Math.max(...pts), min = Math.min(...pts), rng = max-min || 1;
  const d = pts.map((v,i) => `${i?'L':'M'}${(i/(pts.length-1)*W).toFixed(1)},${(H-2-(v-min)/rng*(H-4)).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:70px;height:30px;flex:none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--viz-hi)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

render();
</script>
