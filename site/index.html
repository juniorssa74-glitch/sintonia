function shareSource(d, kind){
  const top = kind === 'artist' ? d.songs.map(s => ({name:s.name, stats:s.stats}))
            : kind === 'album' && d.tracks ? d.tracks.filter(t => t.stats).map(t => ({name:t.name, stats:t.stats})) : [];
  return { kind, title: d.name, artist: kind === 'artist' ? '' : d.artistName, img: d.img, stats: d.stats, lastDate: d.lastDate || d.series?.[d.series.length-1]?.date, top };
}

function loadImg(u){
  return new Promise(ok => { if (!u) return ok(null); const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => ok(im); im.onerror = () => ok(null); im.src = viaProxy(u); });
}
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function coverDraw(ctx, im, x, y, w, h){ const s = Math.max(w/im.width, h/im.height), iw = im.width*s, ih = im.height*s; ctx.drawImage(im, x+(w-iw)/2, y+(h-ih)/2, iw, ih); }
function fitFont(ctx, text, weight, size, maxW, min=20){ let s = size; do { ctx.font = `${weight} ${s}px "Plus Jakarta Sans", sans-serif`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > min); return s; }
function clip(ctx, text, maxW){ if (ctx.measureText(text).width <= maxW) return text; let t = text; while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; }
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOut = p => 1 - Math.pow(1 - p, 3);

/* ---------- mockups: estojo de CD, disco, vinil, polaroid ---------- */
function imgSquare(ctx, im, x, y, s, fallback){ if (im) coverDraw(ctx, im, x, y, s, s); else { ctx.fillStyle = fallback; ctx.fillRect(x, y, s, s); } }
function drawCD(ctx, cx, cy, r, im, angle, full, u){
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 40*u; ctx.shadowOffsetY = 14*u;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = '#c9ced3'; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.arc(cx, cy, r*0.075, 0, 7, true); ctx.clip('evenodd');
  // base prateada
  const g = ctx.createRadialGradient(cx, cy, r*0.1, cx, cy, r); g.addColorStop(0, '#eef1f4'); g.addColorStop(1, '#aeb4ba');
  ctx.fillStyle = g; ctx.fillRect(cx-r, cy-r, 2*r, 2*r);
  // arte impressa (gira)
  const inner = full ? r*0.34 : r*0.36, outer = full ? r*0.985 : r*0.97;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, outer, 0, 7); ctx.arc(cx, cy, inner, 0, 7, true); ctx.clip('evenodd');
  ctx.translate(cx, cy); ctx.rotate(angle); imgSquare(ctx, im, -outer, -outer, 2*outer, '#333'); ctx.restore();
  // anel transparente do miolo
  ctx.beginPath(); ctx.arc(cx, cy, inner, 0, 7); ctx.arc(cx, cy, r*0.075, 0, 7, true);
  ctx.fillStyle = 'rgba(225,232,238,.55)'; ctx.fill('evenodd');
  ctx.beginPath(); ctx.arc(cx, cy, r*0.2, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2*u; ctx.stroke();
  // brilho iridescente (fixo, a luz não gira)
  if (ctx.createConicGradient){
    const s = ctx.createConicGradient(-0.6, cx, cy);
    [[0,'rgba(255,255,255,0)'],[.08,'rgba(255,255,255,.32)'],[.13,'rgba(120,220,255,.18)'],[.2,'rgba(255,255,255,0)'],
     [.5,'rgba(255,255,255,0)'],[.58,'rgba(255,255,255,.28)'],[.63,'rgba(255,170,240,.16)'],[.7,'rgba(255,255,255,0)'],[1,'rgba(255,255,255,0)']].forEach(([o,c]) => s.addColorStop(o, c));
    ctx.fillStyle = s; ctx.fillRect(cx-r, cy-r, 2*r, 2*r);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r - u, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2*u; ctx.stroke();
}
function drawVinyl(ctx, cx, cy, r, im, angle, u){
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40*u; ctx.shadowOffsetY = 14*u;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = '#0b0b0b'; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  ctx.lineWidth = 1.2*u;
  for (let rad = r*0.4; rad < r*0.97; rad += r*0.022){ ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.strokeStyle = `rgba(255,255,255,${rad % (r*0.088) < r*0.022 ? .09 : .045})`; ctx.stroke(); }
  if (ctx.createConicGradient){
    const s = ctx.createConicGradient(-0.9, cx, cy);
    [[0,'rgba(255,255,255,0)'],[.1,'rgba(255,255,255,.16)'],[.2,'rgba(255,255,255,0)'],[.5,'rgba(255,255,255,0)'],[.6,'rgba(255,255,255,.12)'],[.7,'rgba(255,255,255,0)'],[1,'rgba(255,255,255,0)']].forEach(([o,c]) => s.addColorStop(o, c));
    ctx.fillStyle = s; ctx.fillRect(cx-r, cy-r, 2*r, 2*r);
  }
  // selo central com a arte (gira)
  const lr = r*0.36;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, lr, 0, 7); ctx.clip(); ctx.translate(cx, cy); ctx.rotate(angle); imgSquare(ctx, im, -lr, -lr, 2*lr, '#3ddc6f'); ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, lr, 0, 7); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3*u; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r*0.03, 0, 7); ctx.fillStyle = '#0b0b0b'; ctx.fill();
  ctx.restore();
}
function drawCase(ctx, x, y, c, im, u){
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 50*u; ctx.shadowOffsetY = 20*u;
  rr(ctx, x, y, c, c, 10*u); ctx.fillStyle = '#1a1a1a'; ctx.fill(); ctx.restore();
  ctx.save(); rr(ctx, x, y, c, c, 10*u); ctx.clip();
  const sp = c*0.075; // lombada
  imgSquare(ctx, im, x + sp, y, c - sp, '#333');
  const g = ctx.createLinearGradient(x, 0, x + sp, 0); g.addColorStop(0, '#0e0e0e'); g.addColorStop(.6, '#2b2b2b'); g.addColorStop(1, '#111');
  ctx.fillStyle = g; ctx.fillRect(x, y, sp, c);
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = u;
  for (let yy = y + 14*u; yy < y + c; yy += 12*u){ ctx.beginPath(); ctx.moveTo(x + sp*0.25, yy); ctx.lineTo(x + sp*0.75, yy); ctx.stroke(); }
  // brilho do acrílico
  const gl = ctx.createLinearGradient(x, y, x + c, y + c);
  gl.addColorStop(0, 'rgba(255,255,255,.28)'); gl.addColorStop(.35, 'rgba(255,255,255,.06)'); gl.addColorStop(.36, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,.08)');
  ctx.fillStyle = gl; ctx.fillRect(x, y, c, c);
  ctx.restore();
  rr(ctx, x + u, y + u, c - 2*u, c - 2*u, 10*u); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2*u; ctx.stroke();
}
function drawSleeve(ctx, x, y, c, im, u){
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 50*u; ctx.shadowOffsetY = 20*u;
  ctx.fillStyle = '#222'; ctx.fillRect(x, y, c, c); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, c, c); ctx.clip(); imgSquare(ctx, im, x, y, c, '#333');
  const gl = ctx.createLinearGradient(x, y, x + c, y + c); gl.addColorStop(0, 'rgba(255,255,255,.12)'); gl.addColorStop(.5, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(0,0,0,.18)');
  ctx.fillStyle = gl; ctx.fillRect(x, y, c, c); ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2*u; ctx.strokeRect(x + u, y + u, c - 2*u, c - 2*u);
}
// desenha a arte escolhida dentro do quadrado (x, y, s); a = progresso de entrada, spin = ângulo do disco
function drawArt(ctx, mode, im, x, y, s, round, st, a, spin, u){
  if (mode === 'cd' || mode === 'vinil'){
    const c = s*0.7, d = mode === 'cd' ? c*0.94 : c*0.97, cyy = y + s/2, slide = easeOut(clamp01((a - 0.35) / 0.65));
    const caseX = x, discX = caseX + c*0.5 + (x + s - d/2 - (caseX + c*0.5)) * slide;
    if (mode === 'cd') drawCD(ctx, discX, cyy, d/2, im, spin, false, u); else drawVinyl(ctx, discX, cyy, d/2, im, spin, u);
    if (mode === 'cd') drawCase(ctx, caseX, cyy - c/2, c, im, u); else drawSleeve(ctx, caseX, cyy - c/2, c, im, u);
  } else if (mode === 'disco'){
    drawCD(ctx, x + s/2, y + s/2, s/2, im, spin, true, u);
  } else if (mode === 'polaroid'){
    const w = s*0.84, h = w*1.18, ang = -0.06;
    ctx.save(); ctx.translate(x + s/2, y + s/2); ctx.rotate(ang);
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 44*u; ctx.shadowOffsetY = 18*u;
    ctx.fillStyle = '#fbfaf6'; ctx.fillRect(-w/2, -h/2, w, h); ctx.shadowColor = 'transparent';
    const p = w*0.06, iw = w - 2*p;
    ctx.save(); ctx.beginPath(); ctx.rect(-w/2 + p, -h/2 + p, iw, iw); ctx.clip(); imgSquare(ctx, im, -w/2 + p, -h/2 + p, iw, '#333'); ctx.restore();
    ctx.restore();
  } else {
    const rad = round ? s/2 : 18*u;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50*u; ctx.shadowOffsetY = 20*u;
    rr(ctx, x, y, s, s, rad); ctx.fillStyle = st.card; ctx.fill(); ctx.restore();
    if (im){ ctx.save(); rr(ctx, x, y, s, s, rad); ctx.clip(); coverDraw(ctx, im, x, y, s, s); ctx.restore(); }
  }
}

/* ---------- arte: preparo (imagens, fundo) + desenho de um quadro ---------- */
async function prepareShare(src, o){
  const Z = SIZES[o.size], st = STYLES[o.style], W = Z.w, H = Z.h, u = W/1080;
  await document.fonts.load('800 60px "Plus Jakarta Sans"').catch(()=>{});
  const im = await loadImg(src.img);
  // fundo pré-renderizado (o desfoque é caro demais para refazer a cada quadro do vídeo)
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const b = bg.getContext('2d');
  if (st.grad){ const g = b.createLinearGradient(0, 0, W, H); g.addColorStop(0, st.grad[0]); g.addColorStop(1, st.grad[1]); b.fillStyle = g; } else b.fillStyle = st.bg;
  b.fillRect(0, 0, W, H);
  if (st.blur && im){ b.save(); b.filter = `blur(${Math.round(40*u)}px) brightness(.55)`; coverDraw(b, im, -60*u, -60*u, W+120*u, H+120*u); b.restore(); }
  return { W, H, u, st, im, bg };
}

// t = segundos desde o início da animação; null = arte estática (tudo no lugar)
function drawFrame(canvas, src, o, R, t){
  const { W, H, u, st, im, bg } = R;
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  const ctx = canvas.getContext('2d');
  const still = t == null;
  const A = (start, dur = 0.7) => still ? 1 : easeOut(clamp01((t - start) / dur));
  const fadeIn = (a, dy = 30*u) => { ctx.globalAlpha = a; return (1 - a) * dy; };
  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  ctx.drawImage(bg, 0, 0);
  // luz de fundo (pulsa no vídeo)
  const pulse = still ? 1 : 0.75 + 0.25*Math.sin(t*1.6);
  if (o.style === 'escuro' || o.style === 'neon'){
    const rgb = o.style === 'neon' ? '255,61,187' : '61,220,111';
    const g = ctx.createRadialGradient(W*.5, 0, 0, W*.5, 0, H*.8); g.addColorStop(0, `rgba(${rgb},${.22*pulse})`); g.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  const P = o.period, stt = src.stats[P], vertical = H/W >= 0.95;
  const M = 72*u;
  const date = src.lastDate ? new Date(src.lastDate+'T12:00:00Z').toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'}) : '—';
  const wideArt = o.art === 'cd' || o.art === 'vinil';

  // posição da arte
  let cx, cy, cs, tx, ty, tw;
  if (vertical){
    cs = Math.min(W - 2*M - (wideArt ? 0 : 140*u), H*(H/W > 1.5 ? 0.36 : H/W > 1.1 ? 0.33 : 0.3) * (wideArt ? 1.25 : 1));
    cx = (W-cs)/2; cy = M + 30*u; tx = M; tw = W - 2*M; ty = cy + cs + 90*u;
  } else { cs = Math.min(H - 2*M - 80*u, W*0.4); cx = M; cy = (H-cs)/2 - 20*u; tx = cx + cs + 64*u; tw = W - tx - M; ty = cy + 40*u; }
  const aArt = A(0, 1.1), spin = still ? 0.5 : t * 1.4;
  ctx.save();
  if (!still){ const sc = 0.88 + 0.12*easeOut(clamp01(t/0.9)); ctx.globalAlpha = clamp01(t/0.5); ctx.translate(cx + cs/2, cy + cs/2); ctx.scale(sc, sc); ctx.translate(-(cx + cs/2), -(cy + cs/2)); }
  drawArt(ctx, o.art, im, cx, cy, cs, src.kind === 'artist', st, aArt, spin, u);
  ctx.restore(); ctx.globalAlpha = 1;

  const align = vertical ? 'center' : 'left', ax = vertical ? W/2 : tx;
  ctx.textAlign = align;
  let dy;
  dy = fadeIn(A(0.5)); ctx.fillStyle = st.accent; ctx.font = `800 ${28*u}px "Plus Jakarta Sans", sans-serif`;
  ctx.fillText((KIND_LABEL[src.kind] + ' · Spotify').toUpperCase(), ax, ty + dy); ty += 70*u;
  dy = fadeIn(A(0.65)); ctx.fillStyle = st.text; fitFont(ctx, src.title, 800, 76*u, tw, 34*u); ctx.fillText(clip(ctx, src.title, tw), ax, ty + dy); ty += 52*u;
  if (src.artist){ dy = fadeIn(A(0.8)); ctx.fillStyle = st.muted; fitFont(ctx, src.artist, 600, 38*u, tw, 24*u); ctx.fillText(clip(ctx, src.artist, tw), ax, ty + dy); ty += 30*u; }
  ty += 80*u;
  // número principal (conta de 0 até o valor no vídeo)
  const count = still ? 1 : easeOut(clamp01((t - 0.9) / 1.6));
  const big = nf.format(Math.round(stt.value * count));
  dy = fadeIn(A(0.9, 0.4)); ctx.fillStyle = st.accent; fitFont(ctx, nf.format(stt.value), 800, (vertical ? 128 : 112)*u, tw, 48*u); ctx.fillText(big, ax, ty + dy); ty += 50*u;
  dy = fadeIn(A(1.3)); ctx.fillStyle = st.text; ctx.font = `700 ${34*u}px "Plus Jakarta Sans", sans-serif`;
  let line2 = PERIOD_EN[P];
  if (stt.change != null) line2 += `  ${stt.change >= 0 ? '▲' : '▼'} ${Math.abs(stt.change*100).toLocaleString('pt-BR', {maximumFractionDigits:1})}%`;
  ctx.fillText(line2, ax, ty + dy); ty += 46*u;
  dy = fadeIn(A(1.5)); ctx.fillStyle = st.muted; ctx.font = `600 ${28*u}px "Plus Jakarta Sans", sans-serif`;
  ctx.fillText(`Total: ${nf.format(src.stats.total)} streams`, ax, ty + dy); ty += 30*u;
  if (!stt.complete) { ty += 12*u; ctx.font = `600 ${22*u}px "Plus Jakarta Sans", sans-serif`; ctx.fillText(`período parcial · ${stt.covered} de ${stt.days} dias coletados`, ax, ty + dy); ty += 20*u; }
  ctx.globalAlpha = 1;

  // top faixas
  const footerH = 90*u, room = H - ty - footerH - 50*u, rowH = 66*u;
  const n = o.list ? Math.max(0, Math.min(5, Math.floor((room - 60*u) / rowH))) : 0;
  const top = src.top.slice().sort((a,b) => b.stats[P].value - a.stats[P].value).slice(0, n);
  if (top.length){
    ty += 56*u;
    const lx = vertical ? M : tx, lw = vertical ? W - 2*M : tw;
    dy = fadeIn(A(1.8)); ctx.save(); rr(ctx, lx, ty + dy, lw, 40*u + rowH*top.length + 26*u, 22*u); ctx.fillStyle = st.card; ctx.fill(); ctx.restore();
    ty += 52*u; ctx.textAlign = 'left';
    ctx.fillStyle = st.muted; ctx.font = `800 ${22*u}px "Plus Jakarta Sans", sans-serif`;
    ctx.fillText(src.kind === 'artist' ? 'MÚSICAS EM ALTA' : 'FAIXAS EM ALTA', lx + 28*u, ty + dy); ty += 14*u;
    top.forEach((tr, i) => {
      ty += rowH;
      const a = A(2 + i*0.15, 0.5), dx = (1 - a) * 40*u; ctx.globalAlpha = a;
      ctx.textAlign = 'left'; ctx.fillStyle = st.accent; ctx.font = `800 ${30*u}px "Plus Jakarta Sans", sans-serif`;
      ctx.fillText(String(i+1), lx + 28*u + dx, ty - 18*u);
      ctx.fillStyle = st.text; ctx.font = `700 ${30*u}px "Plus Jakarta Sans", sans-serif`;
      const v = fmtN(tr.stats[P].value); ctx.textAlign = 'right';
      ctx.fillText(v, lx + lw - 28*u + dx, ty - 18*u); const vw = ctx.measureText(v).width;
      ctx.textAlign = 'left'; ctx.fillText(clip(ctx, tr.name, lw - 120*u - vw), lx + 76*u + dx, ty - 18*u);
    });
    ctx.globalAlpha = 1;
  }
  // rodapé: data no canto esquerdo, marca no direito
  ctx.globalAlpha = A(2.4); const fy = H - M + 20*u;
  ctx.textAlign = 'right'; ctx.fillStyle = st.text; ctx.font = `800 ${28*u}px "Plus Jakarta Sans", sans-serif`;
  ctx.fillText('Sintonia', W - M, fy); const sw = ctx.measureText('Sintonia').width;
  ctx.textAlign = 'left'; ctx.fillStyle = st.muted; ctx.font = `600 ${24*u}px "Plus Jakarta Sans", sans-serif`;
  ctx.fillText(clip(ctx, `Atualização: ${date}`, W - 2*M - sw - 40*u), M, fy);
  ctx.globalAlpha = 1;
}

/* ---------- exportar: imagem (PNG) ou vídeo (MP4/WebM) ---------- */
const fileBase = name => 'sintonia-' + name.normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase().slice(0, 40);
const blobB64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
async function exportBlob(blob, file, title, kindLabel){
  const FS = capPlugin('Filesystem'), SH = capPlugin('Share');
  if (FS && SH){
    const w = await FS.writeFile({path: file, data: await blobB64(blob), directory: 'CACHE'});
    try { await SH.share({title, files: [w.uri], dialogTitle: `Compartilhar ${kindLabel}`}); }
    catch (e) { if (!/cancel/i.test(e.message || '')) throw e; }
    return;
  }
  const f = new File([blob], file, {type: blob.type});
  if (navigator.canShare?.({files:[f]})) { try { await navigator.share({files:[f], title}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`${kindLabel[0].toUpperCase() + kindLabel.slice(1)} salvo em Downloads`);
}
function videoMime(){
  if (!window.MediaRecorder) return null;
  return ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } }) || null;
}
// grava a animação em tempo real a partir do canvas (MediaRecorder)
function recordMotion(canvas, src, o, R, onProgress){
  return new Promise((ok, no) => {
    const mime = videoMime(); if (!mime || !canvas.captureStream) return no(new Error('Gravação de vídeo não suportada neste aparelho'));
    const stream = canvas.captureStream(30), chunks = [];
    const rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: 8e6});
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(tr => tr.stop()); ok(new Blob(chunks, {type: mime.split(';')[0]})); };
    rec.onerror = e => no(e.error || new Error('falha na gravação'));
    drawFrame(canvas, src, o, R, 0);
    rec.start(250);
    const t0 = performance.now();
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      drawFrame(canvas, src, o, R, Math.min(t, MOTION_SECS));
      onProgress?.(t);
      if (t < MOTION_SECS) requestAnimationFrame(tick); else setTimeout(() => rec.stop(), 120);
    };
    requestAnimationFrame(tick);
  });
}

Screens.share = function({src}, alive){
  const o = { size: store.get('shareSize', 'story'), style: store.get('shareStyle', 'escuro'), art: store.get('shareArt', 'padrao'),
              motion: store.get('shareMotion', false), period: S.period, list: true };
  if (!ARTS[o.art]) o.art = 'padrao';
  const canVideo = !!videoMime();
  if (!canVideo) o.motion = false;
  view.innerHTML = `
    <button class="back" onclick="back()">${I.back}</button>
    <h1>Criar imagem</h1>
    <div class="sub" style="margin-bottom:12px">${esc(KIND_LABEL[src.kind])} · ${esc(src.title)}</div>
    <div class="preview"><canvas id="cv"></canvas></div>
    <h2 style="margin-top:18px">Formato</h2>
    <div class="seg" id="omotion"><button data-v="0" class="${o.motion?'':'on'}">Imagem (PNG)</button><button data-v="1" class="${o.motion?'on':''}" ${canVideo?'':'disabled title="Este navegador não grava vídeo"'}>Animado (vídeo ${MOTION_SECS}s)</button></div>
    <h2>Dimensão</h2>
    <div class="opts" id="osize">${Object.entries(SIZES).map(([k,v]) => `<button data-v="${k}" class="${o.size===k?'on':''}"><b>${v.label}</b><i>${v.sub}</i></button>`).join('')}</div>
    <h2>Capa</h2>
    <div class="opts" id="oart">${Object.entries(ARTS).map(([k,v]) => `<button data-v="${k}" class="${o.art===k?'on':''}"><b>${v.label}</b><i>${v.sub}</i></button>`).join('')}</div>
    <h2>Estilo</h2>
    <div class="opts" id="ostyle">${Object.entries(STYLES).map(([k,v]) => `<button data-v="${k}" class="${o.style===k?'on':''}"><span class="sw" style="background:${v.grad ? `linear-gradient(135deg,${v.grad[0]},${v.grad[1]})` : v.bg};border-color:${v.accent}"></span><b>${v.label}</b></button>`).join('')}</div>
    <h2>Período</h2>
    <div class="seg" id="operiod">${Object.entries(P).map(([k,v]) => `<button data-v="${k}" class="${o.period===k?'on':''}">${v.label}</button>`).join('')}</div>
    ${src.top.length ? `<label class="note" style="display:flex;gap:8px;align-items:center;margin:4px 0 16px"><input type="checkbox" id="olist" checked> Mostrar ${src.kind==='artist'?'músicas':'faixas'} em alta</label>` : ''}
    <button class="btn" id="sbtn" style="width:100%;padding:14px;font-size:15px"></button>
    <p class="note" id="snote" style="margin-top:8px"></p>`;
  const cv = $('#cv'), btn = $('#sbtn');
  let R = null, loop = 0, recording = false, prep = Promise.resolve();
  const label = () => { btn.textContent = o.motion ? 'Gerar e compartilhar vídeo' : 'Compartilhar / salvar imagem';
    $('#snote').textContent = o.motion ? `O vídeo é gravado em tempo real (${MOTION_SECS}s) no formato ${(videoMime()||'').includes('mp4') ? 'MP4' : 'WebM'}.` : ''; };
  const stopLoop = () => { cancelAnimationFrame(loop); loop = 0; };
  const play = () => { stopLoop(); const t0 = performance.now();
    const f = () => { if (!alive() || !cv.isConnected) return stopLoop(); if (!recording) drawFrame(cv, src, o, R, ((performance.now() - t0) / 1000) % MOTION_SECS); loop = requestAnimationFrame(f); };
    loop = requestAnimationFrame(f); };
  // muda tamanho/estilo => refaz o preparo; o resto só redesenha
  const redraw = (reprep) => {
    if (reprep || !R) prep = prepareShare(src, o).then(r => { R = r; });
    prep.then(() => { cv.style.aspectRatio = `${R.W}/${R.H}`; if (o.motion) play(); else { stopLoop(); drawFrame(cv, src, o, R, null); } });
  };
  const bind = (sel, key, persist, reprep, parse = v => v) => $(sel).onclick = e => { const b = e.target.closest('[data-v]'); if (!b || b.disabled || recording) return; o[key] = parse(b.dataset.v); if (persist) store.set(persist, o[key]);
    $(sel).querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); label(); redraw(reprep); };
  bind('#osize', 'size', 'shareSize', true); bind('#ostyle', 'style', 'shareStyle', true); bind('#oart', 'art', 'shareArt'); bind('#operiod', 'period');
  bind('#omotion', 'motion', 'shareMotion', false, v => v === '1');
  if ($('#olist')) $('#olist').onchange = e => { o.list = e.target.checked; redraw(); };
  btn.onclick = async () => {
    if (recording) return;
    await prep;
    try {
      if (!o.motion){ const blob = await new Promise(r => cv.toBlob(r, 'image/png')); return await exportBlob(blob, fileBase(src.title) + '.png', src.title, 'imagem'); }
      recording = true; stopLoop(); btn.disabled = true;
      const blob = await recordMotion(cv, src, o, R, t => { btn.textContent = `Gravando vídeo… ${Math.min(MOTION_SECS, Math.floor(t))}/${MOTION_SECS}s`; });
      btn.textContent = 'Preparando…';
      await exportBlob(blob, fileBase(src.title) + (blob.type.includes('mp4') ? '.mp4' : '.webm'), src.title, 'vídeo');
    } catch (e) { toast(e.message?.startsWith('Gravação') ? e.message : 'Não foi possível compartilhar'); console.error(e); }
    finally { recording = false; btn.disabled = false; label(); if (o.motion) play(); }
  };
  label(); redraw(true);
};

/* =================== SPOTIFY CHARTS (CSV importado pelo usuário) =================== */
// O usuário baixa o CSV logado em charts.spotify.com ("Download CSV") e importa aqui.
// Fica salvo só neste aparelho (localStorage).
const SPC_KEY = 'spCharts', SPC_MAX = 120;
const spcAll = () => store.get(SPC_KEY, []);
function spcSave(list){
  list.sort((a, b) => (b.date || '').localeCompare(a.date || '') || a.name.localeCompare(b.name));
  try { localStorage.setItem(SPC_KEY, JSON.stringify(list.slice(0, SPC_MAX))); return true; }
  catch { toast('Sem espaço: apague alguns charts antigos'); return false; }
}
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x !== '')) rows.push(row);
  return rows;
}
const SPC_PERIOD = {daily:'Diário', weekly:'Semanal'};
const SPC_KIND = {regional:'Top músicas', viral:'Viral', city:'Cidade', album:'Top álbuns', artist:'Top artistas'};
function spcMeta(fileName){
  const base = fileName.replace(/\.csv$/i, '');
  const m = base.match(/^([a-z]+)-(.+)-(daily|weekly)-(\d{4}-\d{2}-\d{2})$/i);
  if (!m) return { id: base, name: base, date: null };
  let [, kind, where, per, date] = m; kind = kind.toLowerCase();
  // ex.: regional-br-daily, regional-global-weekly, viral-br-daily, city-saopaulo-weekly, album-br-weekly…
  if (kind === 'regional' && /-album$/.test(where)) { kind = 'album'; where = where.replace(/-album$/, ''); }
  const place = where === 'global' ? 'Global' : where.length === 2 ? regionName(where, where.toUpperCase()) : where.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  return { id: base, date, cc: where.length === 2 ? where : where === 'global' ? 'global' : '', name: `${SPC_KIND[kind] || kind} · ${place} · ${SPC_PERIOD[per.toLowerCase()] || per}` };
}
function spcParse(text, fileName){
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => r.map(x => x.trim().toLowerCase()).includes('rank'));
  if (hi < 0) throw new Error('não parece um CSV do Spotify Charts (sem coluna "rank")');
  const H = rows[hi].map(x => x.trim().toLowerCase()), col = (...n) => n.map(x => H.indexOf(x)).find(i => i >= 0) ?? -1;
  const c = { rank: col('rank'), uri: col('uri'), artist: col('artist_names', 'artist_name'), title: col('track_name', 'album_name', 'name', 'artist_name'),
              prev: col('previous_rank'), peak: col('peak_rank'), days: col('days_on_chart', 'weeks_on_chart'), streams: col('streams') };
  const weeks = H.includes('weeks_on_chart');
  const n = v => { const x = parseInt(String(v ?? '').replace(/[^\d-]/g, ''), 10); return isNaN(x) ? null : x; };
  const data = rows.slice(hi + 1).filter(r => n(r[c.rank]) != null).map(r => {
    const uri = c.uri >= 0 ? r[c.uri] || '' : '';
    const id = (uri.match(/[A-Za-z0-9]{22}$/) || [])[0] || null;
    return [n(r[c.rank]), id, c.artist >= 0 ? r[c.artist] : '', c.title >= 0 ? r[c.title] : '', n(r[c.prev]), n(r[c.peak]), n(r[c.days]), n(r[c.streams])];
  });
  if (!data.length) throw new Error('CSV sem linhas');
  return { ...spcMeta(fileName), weeks, hasStreams: c.streams >= 0, importedAt: new Date().toISOString(), rows: data };
}
async function spcImport(files){
  const list = spcAll(); let ok = 0;
  for (const f of files){
    try {
      const ch = spcParse(await f.text(), f.name);
      const i = list.findIndex(x => x.id === ch.id);
      if (i >= 0) list[i] = ch; else list.push(ch);
      ok++;
    } catch (e) { toast(`${f.name}: ${e.message}`); }
  }
  if (ok && spcSave(list)) toast(`${ok} ${ok === 1 ? 'chart importado' : 'charts importados'}`);
}
const trackedNames = () => (S._summary?.artists || []).map(a => norm(a.name));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const isTrackedRow = (r, names) => names.length && norm(r[2]).split(/,\s*/).some(a => names.includes(a.trim()));
function rankMove(rank, prev){
  if (prev == null || prev <= 0) return '<span class="d ne">novo</span>';
  const d = prev - rank;
  return d > 0 ? `<span class="d up">▲ ${d}</span>` : d < 0 ? `<span class="d down">▼ ${-d}</span>` : '<span class="d eq">=</span>';
}
const fmtDay = d => d ? new Date(d + 'T12:00:00Z').toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';

Screens.spcharts = async function(_, alive){
  if (!S._summary) { try { S._summary = await dataJSON('summary.json'); } catch {} }
  if (!alive()) return;
  const list = spcAll();
  view.innerHTML = `
    <button class="back" onclick="back()">${I.back}</button>
    <h1>Spotify Charts</h1>
    <div class="sub" style="margin:4px 0 12px">CSVs que você baixou em charts.spotify.com · salvos só neste aparelho</div>
    <div class="actions" style="flex-wrap:wrap">
      <label class="btn" style="cursor:pointer">Importar CSV<input type="file" id="spcf" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel" multiple hidden></label>
      <a class="pill" href="https://charts.spotify.com/charts/overview/global" target="_blank" rel="noopener">Abrir Spotify Charts</a>
    </div>
    <div id="spcl">${list.length ? list.map(c => `
      <div class="row" style="gap:10px">
        <button class="t" data-open="${esc(c.id)}" style="flex:1;text-align:left;min-width:0"><b>${esc(c.name)}</b><i>${c.date ? fmtDay(c.date) + ' · ' : ''}${c.rows.length} posições</i></button>
        <button class="pill" data-del="${esc(c.id)}" aria-label="Apagar">Apagar</button>
      </div>`).join('') : `<p class="empty" style="text-align:left">Como usar: em charts.spotify.com, abra um chart (ex.: Top Songs Brasil, diário), toque em <b>Download CSV</b> e depois em <b>Importar CSV</b> aqui. Pode escolher vários arquivos de uma vez.</p>`}</div>`;
  $('#spcf').onchange = async e => { await spcImport([...e.target.files]); render(); };
  $('#spcl').onclick = e => {
    const o = e.target.closest('[data-open]'); if (o) return go({type:'spchart', id:o.dataset.open});
    const d = e.target.closest('[data-del]'); if (d && confirm('Apagar este chart do aparelho?')) { spcSave(spcAll().filter(x => x.id !== d.dataset.del)); render(); }
  };
};

Screens.spchart = async function({id}){
  const c = spcAll().find(x => x.id === id);
  if (!c) { back(); return; }
  if (!S._summary) { try { S._summary = await dataJSON('summary.json'); } catch {} }
  const names = trackedNames();
  let mine = false, q = '';
  const paint = () => {
    const rows = c.rows.filter(r => (!mine || isTrackedRow(r, names)) && (!q || norm(r[2] + ' ' + r[3]).includes(norm(q))));
    $('#spr').innerHTML = rows.map(r => `
      <div class="crow" style="grid-template-columns:34px 1fr 64px 46px;${isTrackedRow(r, names) ? 'background:color-mix(in srgb, var(--accent) 12%, transparent);' : ''}">
        <span class="pos" style="text-align:left">#${r[0]}</span>
        <span style="min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r[3] || r[2])}</b><i style="display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r[3] ? r[2] : '')}${r[5] ? ` · pico #${r[5]}` : ''}${r[6] ? ` · ${r[6]} ${c.weeks ? 'sem.' : 'dias'}` : ''}</i></span>
        <span class="pos" style="font-weight:600;font-size:12px">${r[7] != null ? nf.format(r[7]) : ''}</span>
        ${rankMove(r[0], r[4])}
      </div>`).join('') || '<p class="empty">Nada encontrado.</p>';
  };
  view.innerHTML = `
    <button class="back" onclick="back()">${I.back}</button>
    <h1 style="font-size:24px">${esc(c.name)}</h1>
    <div class="sub" style="margin:4px 0 12px">${c.date ? fmtDay(c.date) + ' · ' : ''}${c.rows.length} posições · importado do Spotify Charts</div>
    <div class="chips" style="margin-bottom:8px"><button class="chip on" id="all">Todos</button><button class="chip" id="mine" ${names.length ? '' : 'disabled'}>Artistas que acompanho</button></div>
    <input class="filter" id="spq" placeholder="Filtrar por música ou artista…">
    <div class="crow thead" style="grid-template-columns:34px 1fr 64px 46px;font-size:11px;color:var(--muted);font-weight:700"><span>#</span><span>Música</span><span class="pos" style="font-weight:700">${c.hasStreams ? 'Streams' : ''}</span><span class="d">Mov.</span></div>
    <div id="spr"></div>`;
  const setMine = v => { mine = v; $('#all').classList.toggle('on', !v); $('#mine').classList.toggle('on', v); paint(); };
  $('#all').onclick = () => setMine(false); $('#mine').onclick = () => setMine(true);
  $('#spq').oninput = e => { q = e.target.value; paint(); };
  paint();
};

// na página da música/álbum: posições nos CSVs importados (casando pelo ID do Spotify)
function spcBlock(id){
  const hits = spcAll().map(c => ({c, r: c.rows.find(r => r[1] === id)})).filter(x => x.r);
  if (!hits.length) return '';
  return `<h2>Spotify Charts <small>seus CSVs</small></h2>
    ${hits.map(({c, r}) => `<div class="crow" style="grid-template-columns:1fr 46px 70px 46px">
      <span style="min-width:0"><b style="display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</b><i style="display:block;font-style:normal;font-size:11px;color:var(--muted)">${fmtDay(c.date)}${r[5] ? ` · pico #${r[5]}` : ''}</i></span>
      <span class="pos">#${r[0]}</span><span class="pos" style="font-weight:600;font-size:12px">${r[7] != null ? nf.format(r[7]) : ''}</span>${rankMove(r[0], r[4])}</div>`).join('')}`;
}

/* =================== MÚSICAS DO CELULAR =================== */
// No APK: plugin nativo "LocalAudio" lista os áudios do aparelho (MediaStore), já sem WhatsApp.
// No navegador: o usuário escolhe os arquivos; nomes típicos do WhatsApp são descartados.
const LOCAL_ART = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1d3b29"/><path d="M40 28v34.5a10 10 0 1 0 6 9.2V40l22-5v20.5a10 10 0 1 0 6 9.2V22z" fill="#3ddc6f"/></svg>');
function capPlugin(name){
  const C = window.Capacitor;
  if (!C?.isNativePlatform?.()) return null;
  capPlugin.cache ??= {};
  return capPlugin.cache[name] ??= (C.registerPlugin ? C.registerPlugin(name) : C.Plugins?.[name] || null);
}
const isWhatsApp = s => /whatsapp|com\.whatsapp|^(ptt|aud)-\d{8}-wa\d+/i.test(s);
S.localTracks = null;
function localItem(t){ return { kind:'local', id:'l'+t.id, title:t.title, sub:[t.artist, t.album].filter(Boolean).join(' · ') || 'No celular', art:LOCAL_ART, url:t.url, dur:t.duration/1000 }; }

Screens.local = async function(_, alive){
  const native = capPlugin('LocalAudio');
  const paint = () => {
    const list = S.localTracks || [];
    view.innerHTML = `
      <button class="back" onclick="back()">${I.back}</button>
      <h1>Músicas do celular</h1>
      <div class="sub" style="margin:4px 0 12px">${S.localTracks ? `${list.length} arquivos · áudios do WhatsApp ficam de fora` : 'Toque abaixo para ler os áudios do aparelho'}</div>
      <div class="actions">
        ${native ? `<button class="btn" id="scan">${S.localTracks ? 'Atualizar lista' : 'Ler músicas do celular'}</button>`
                 : `<label class="btn" style="cursor:pointer">Escolher arquivos<input type="file" id="pick" accept="audio/*" multiple hidden></label>`}
        ${list.length ? `<button class="bigplay" id="pa">${I.play}</button>` : ''}
      </div>
      ${list.length > 8 ? `<input class="filter" id="lf" placeholder="Filtrar por nome, artista ou álbum…">` : ''}
      <div id="ll">${list.length ? '' : `<p class="empty">${native ? 'O app vai pedir permissão para acessar músicas e áudios.' : 'No navegador, escolha os arquivos de áudio. No app (APK), a lista é lida automaticamente.'}</p>`}</div>`;
    const items = list.map(localItem);
    const rows = q => {
      const f = items.map((s,i) => [s,i]).filter(([s]) => !q || (s.title+' '+s.sub).toLowerCase().includes(q.toLowerCase())).slice(0, 400);
      $('#ll').innerHTML = f.map(([s,i]) => `<div class="row" data-play="${i}"><img src="${s.art}" alt=""><div class="t"><b data-pid="${s.id}" class="${S.cur?.id===s.id?'playing':''}">${esc(s.title)}</b><i>${esc(s.sub)} · ${fmt(s.dur)}</i></div></div>`).join('');
    };
    if (list.length) { rows(''); $('#ll').onclick = e => { const b = e.target.closest('[data-play]'); if (b) playQueue(items, +b.dataset.play, 'Músicas do celular'); }; $('#pa').onclick = () => playQueue(items, 0, 'Músicas do celular'); }
    if ($('#lf')) $('#lf').oninput = e => rows(e.target.value);
    if ($('#scan')) $('#scan').onclick = async () => {
      $('#scan').textContent = 'Lendo…';
      try {
        const r = await native.list();
        S.localTracks = r.items.filter(t => !isWhatsApp(t.path || '') && !isWhatsApp(t.name || ''))
          .map(t => ({ ...t, url: window.Capacitor.convertFileSrc(t.path) }));
        if (alive()) paint();
      } catch (e) { toast(/perm/i.test(e.message) ? 'Permissão negada nas configurações do Android' : 'Não foi possível ler as músicas'); if (alive()) paint(); }
    };
    if ($('#pick')) $('#pick').onchange = e => {
      const files = [...e.target.files].filter(f => !isWhatsApp(f.name));
      (S.localTracks || []).forEach(t => t.blob && URL.revokeObjectURL(t.url));
      S.localTracks = files.map((f, i) => ({ id: 'f'+i+f.size, title: f.name.replace(/\.[^.]+$/, ''), artist:'', album:'', duration:0, url: URL.createObjectURL(f), blob:true }));
      paint();
    };
  };
  paint();
  if (native && !S.localTracks) $('#scan').click();
};

function spark(pts){
  if (!pts || pts.length < 2) return '';
  const W = 70, H = 30, max = Math.max(...pts), min = Math.min(...pts), rng = max-min || 1;
  const d = pts.map((v,i) => `${i?'L':'M'}${(i/(pts.length-1)*W).toFixed(1)},${(H-2-(v-min)/rng*(H-4)).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:70px;height:30px;flex:none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--viz-hi)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

render();
</script>
