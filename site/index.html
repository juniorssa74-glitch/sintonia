<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4EF">
<title>Sintonia</title>
<script>
  // Dentro do APK (Capacitor), carrega a ponte JS para usar compartilhar, arquivos e músicas do celular.
  if (window.Capacitor) document.write('<script src="https://cdn.jsdelivr.net/npm/@capacitor/core@7.6.9/dist/capacitor.js"><\/script>');
</script>
<meta name="description" content="Streams diários, semanais e mensais de artistas e álbuns no Spotify">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4EF; --bg2:#ECEAE2; --card:#FFFFFF; --card2:#ECEAE2; --line:#E6E4DC;
  --text:#121413; --muted:#5C6560; --accent:#13843F; --accent-ink:#FFFFFF; --accent-soft:rgba(19,132,63,.10);
  --live:#B3261E; --radius:18px; --shadow:0 1px 2px rgba(18,20,19,.04), 0 6px 20px rgba(18,20,19,.06);
  --viz:#1F9D4F; --viz-hi:#13843F; --good:#13843F; --bad:#B3261E; --bad-soft:rgba(179,38,30,.08); --new:#9A6700;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E9E7E0;color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px;display:flex;justify-content:center;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
img{display:block}
a{color:var(--accent)}
.app{position:relative;width:100%;max-width:440px;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:600px){.app{height:min(900px,96dvh);margin-top:2dvh;border-radius:32px;box-shadow:0 30px 80px rgba(18,20,19,.18)}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 20px 170px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}

/* topo */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top h1{font-size:28px}
.kicker{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.roundbtn{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;color:var(--text)}
.roundbtn svg{width:20px;height:20px}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--text);color:var(--bg);box-shadow:none;font-weight:700}
.chip:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.livebar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:-6px 0 16px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(19,132,63,.45)}70%{box-shadow:0 0 0 7px rgba(19,132,63,0)}100%{box-shadow:0 0 0 0 rgba(19,132,63,0)}}

h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
h2 small{font-size:12px;font-weight:600;color:var(--muted);margin-left:auto}

/* recentes */
.recents{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;overflow:hidden;height:56px;text-align:left;box-shadow:var(--shadow)}
.rc img,.rc .ph{width:56px;height:56px;object-fit:cover;flex:none;background:var(--card2)}
.rc span{font-weight:700;font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:8px}

/* prateleiras */
.shelf{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.tile{width:140px;flex:none;text-align:left}
.tile img,.tile .ph{width:140px;height:140px;border-radius:14px;object-fit:cover;background:var(--card2);margin-bottom:8px;box-shadow:var(--shadow)}
.tile.round img,.tile.round .ph{border-radius:50%}
.tile b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rank{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700}
.up{color:var(--good)} .down{color:var(--bad)}

/* destaque */
.feature{display:flex;gap:14px;background:var(--card);border-radius:var(--radius);padding:12px;text-align:left;width:100%;box-shadow:var(--shadow)}
.feature img{width:110px;height:110px;border-radius:12px;object-fit:cover;flex:none}
.feature .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.feature .k{font-size:11px;color:var(--muted)}
.feature b{font-size:15px}
.feature p{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* rádios */
.radio{width:150px;flex:none;background:var(--card);border-radius:var(--radius);padding:10px;text-align:left;position:relative;box-shadow:var(--shadow)}
.radio img,.radio .ph{width:100%;aspect-ratio:1;border-radius:12px;object-fit:contain;background:var(--bg);margin-bottom:8px}
.radio b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio i{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:16px;left:16px;background:var(--live);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.flash{animation:flash 1s}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--card)}}

/* linhas */
.row{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.row img,.row .ph{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--card2)}
.row.round img{border-radius:50%}
.row .t{min-width:0;flex:1}
.row b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-pid].playing{color:var(--accent)}
.row i{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .num{width:22px;text-align:center;color:var(--muted);font-weight:700;flex:none}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text)}
.icon-btn.on{color:var(--accent)}
svg{width:22px;height:22px;fill:currentColor}

/* busca */
.searchbox{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--text);border-radius:14px;padding:12px 14px;margin:14px 0 4px;box-shadow:var(--shadow)}
.searchbox svg{fill:var(--muted)}
.searchbox input{border:0;outline:0;flex:1;background:none;color:var(--text);font-weight:600}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{height:96px;border-radius:16px;padding:12px;font-weight:800;font-size:15px;text-align:left;position:relative;overflow:hidden;color:#fff}
.cat img{position:absolute;right:-14px;bottom:-6px;width:68px;height:68px;transform:rotate(22deg);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* cabeçalho de detalhe */
.back{width:44px;height:44px;display:grid;place-items:center;margin:-6px 0 8px -6px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);color:var(--text)}
.back svg{width:22px;height:22px}
.hero{width:220px;height:220px;margin:4px auto 18px;border-radius:18px;object-fit:cover;box-shadow:0 18px 40px rgba(18,20,19,.22);background:var(--card2)}
.detail-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.detail-head img,.detail-head .ph{width:112px;height:112px;border-radius:16px;object-fit:cover;flex:none;box-shadow:0 12px 28px rgba(18,20,19,.18);background:var(--card2)}
.detail-head .k{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.detail-head h1{font-size:23px}
.sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
.actions{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.pill{border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--text)}
a.pill{text-decoration:none;display:inline-block}
.pill.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.bigplay{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-left:auto;box-shadow:0 8px 20px rgba(19,132,63,.3)}
.bigplay svg{width:26px;height:26px}
.ep{padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ep b{display:block;font-size:14px;margin-bottom:4px}
.ep p{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .em{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.ep .em .bigplay{width:34px;height:34px;margin:0;background:var(--text);color:var(--bg);box-shadow:none}
.ep .em .bigplay svg{width:18px;height:18px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:22px 0 6px}
.tabs button{padding:0 0 10px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);font-weight:800;border-color:var(--accent)}

/* estados */
.ph{background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:shim 1.2s infinite linear}
@keyframes shim{to{background-position:-200% 0}}
.empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.6}
.err{color:var(--muted);font-size:12px;padding:8px 0}

/* mini player */
.mini{position:absolute;left:16px;right:16px;bottom:92px;background:var(--card);border-radius:18px;padding:8px 10px;display:none;align-items:center;gap:10px;z-index:5;overflow:hidden;cursor:pointer;box-shadow:0 8px 28px rgba(18,20,19,.16)}
.mini.show{display:flex}
.mini img{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none}
.mini .t{flex:1;min-width:0}
.mini b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini i{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--line);border-radius:2px}
.mini .bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}

/* navegação flutuante */
.nav{position:absolute;left:16px;right:16px;bottom:16px;height:66px;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.96);border-radius:24px;box-shadow:0 10px 30px rgba(18,20,19,.14);z-index:4}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);flex:1;min-width:0;height:100%;justify-content:center}
.nav button.on{color:var(--accent);font-weight:800}

/* ---- streams ---- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card);border-radius:14px;padding:4px;gap:4px;margin:4px 0 16px;box-shadow:var(--shadow)}
.seg button{height:36px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}
.seg button:disabled{opacity:.45}
.hcard{display:flex;flex-direction:column;gap:16px;background:var(--card);border-radius:22px;padding:18px;width:100%;text-align:left;box-shadow:var(--shadow);margin-bottom:12px}
.hcard .hd{display:flex;align-items:center;gap:12px}
.hcard .hd img,.hcard .hd .ph{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.hcard .hd b{display:block;font-size:17px;font-weight:800}
.hcard .hd .t{flex:1;min-width:0}
.hcard .hd svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2}
.hcard .num{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hcard .num span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.hcard .num strong{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.prog2{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.prog2 span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.badge2{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.badge2.down{background:var(--bad-soft);color:var(--bad)} .badge2.up{background:var(--accent-soft);color:var(--good)}
.acard{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:14px 18px;width:100%;text-align:left;margin-bottom:12px;box-shadow:var(--shadow)}
.acard img,.acard .ph{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.acard .t{flex:1;min-width:0}
.acard b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .v{text-align:right;flex:none}
.acard .v strong{display:block;font-size:17px;font-weight:800}
.bignum{font-size:22px;font-weight:800;letter-spacing:-.02em}
.note{font-size:12px;color:var(--muted)}
.chg{font-size:12px;font-weight:700;white-space:nowrap}
.chg.up{color:var(--good)} .chg.down{color:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.kpi{background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.kpi .note{font-size:11px}
.chart{position:relative;background:var(--card);border-radius:20px;padding:16px 12px 8px;margin-bottom:10px;box-shadow:var(--shadow)}
.chart h3{font-size:14px;font-weight:800;margin:0 6px 8px;display:flex;justify-content:space-between;align-items:center}
.chart h3 button{font-size:12px;color:var(--accent);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:9px;font-family:inherit}
.chart .bar{fill:var(--viz)} .chart .bar.partial{fill:var(--viz);opacity:.4}
.chart .hit:hover + .bar,.chart .bar.hl{fill:var(--viz-hi);opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:11px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2;box-shadow:0 6px 16px rgba(18,20,19,.25)}
.tip b{font-size:13px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.tbl td{padding:6px 6px;border-top:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.hero-artist{margin:-24px -20px 0;height:310px;padding:20px;background-size:cover;background-position:center 25%;position:relative;display:flex;flex-direction:column;justify-content:space-between;border-radius:0 0 28px 28px;overflow:hidden;color:#fff}
.hero-artist::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.7) 100%)}
.hero-artist>*{position:relative}
.hero-artist .back{background:rgba(255,255,255,.9);margin:0}
.hero-artist h1{font-size:40px;letter-spacing:-.03em;line-height:1}
.hero-artist .note{color:rgba(255,255,255,.85);font-weight:600;margin-top:6px}
.actrow{display:flex;gap:8px;margin:16px 0 4px}
.actrow .btn{flex:1;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.actrow .btn svg{width:18px;height:18px}
.sheet{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px 0;margin:8px 0}
.sheet a,.sheet button{display:block;width:100%;text-align:left;padding:12px 16px;font-weight:600;font-size:14px;color:var(--text);text-decoration:none}
.sheet .danger{color:var(--bad)}
.irow{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;text-align:left}
.irow img,.irow .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:var(--card2)}
.irow .num{width:20px;text-align:center;color:var(--muted);font-weight:700;font-size:13px;flex:none}
.irow .t{flex:1;min-width:0}
.irow b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.irow .v{text-align:right;flex:none}
.irow .v b{font-weight:800}
.addbox{background:var(--card);border-radius:18px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow)}
.addbox input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);outline:none}
.addbox input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:999px;padding:9px 16px;font-size:13px}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.6}
.filter{width:100%;background:var(--card);border:0;border-radius:12px;padding:11px 14px;color:var(--text);outline:none;margin:10px 0;box-shadow:inset 0 0 0 1px var(--line)}
.filter:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:8px 0 6px}
.split span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.trow{display:grid;grid-template-columns:28px 1fr 74px 74px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.trow:disabled{cursor:default;opacity:.55}
.trow .num{color:var(--muted);font-weight:700;font-size:12px;text-align:center}
.trow .t{min-width:0}
.trow .t b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow i{display:block;font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.trow .c{text-align:right}
.trow .c b{display:block;font-size:13px}
.trow.thead{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.trow.tfoot{border-bottom:0;font-size:12px;color:var(--muted)}
.chb{display:inline-block;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.cbox{background:var(--card);border-radius:18px;padding:2px 16px;box-shadow:var(--shadow);margin-top:10px}
.crow{display:grid;grid-template-columns:34px 1fr 54px 60px;gap:8px;align-items:center;min-height:46px;border-bottom:1px solid var(--line);font-size:14px}
.crow:last-child{border-bottom:0}
.crow .fl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.crow .pos{text-align:right;font-weight:800;font-size:15px}
.crow .d{text-align:right;font-size:12px;font-weight:700}
.crow .d.up{color:var(--good)} .crow .d.down{color:var(--bad)} .crow .d.ne{color:var(--new)} .crow .d.eq{color:var(--muted)}
.crow.thead{min-height:32px;font-size:11px;color:var(--muted);font-weight:700}
.preview{background:var(--card);border-radius:22px;padding:14px;display:flex;justify-content:center;box-shadow:var(--shadow)}
.preview canvas{max-width:100%;max-height:52vh;width:auto;height:auto;border-radius:10px;box-shadow:0 12px 30px rgba(18,20,19,.25)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--card);border-radius:14px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 1px var(--line)}
.opts button.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.opts b{font-size:13px} .opts i{font-style:normal;font-size:11px;color:var(--muted)}
.opts .sw{width:100%;height:26px;border-radius:8px;border-bottom:4px solid;margin-bottom:4px}

/* player em tela cheia (continua escuro, como uma capa) */
.full{position:absolute;inset:0;z-index:10;background:linear-gradient(180deg,#2d5a3c 0%,#12251a 55%,#0d0f0e 100%);color:#fff;padding:16px 22px 28px;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease}
.full.show{transform:none}
.full .icon-btn{color:#e4ece7}
.full .fh{display:flex;align-items:center;justify-content:space-between;text-align:center}
.full .fh div{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#cfe3d6}
.full .fh b{display:block;font-size:13px;text-transform:none;letter-spacing:0;color:#fff;margin-top:2px}
.full .art{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;margin:auto 0 24px;box-shadow:0 20px 50px #0008;background:#ffffff14}
.full .art.radio-art{object-fit:contain;padding:30px;background:#ffffff14}
.full .ti{display:flex;align-items:center;gap:10px}
.full .ti div{flex:1;min-width:0}
.full .ti h3{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .ti p{color:#cfe3d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin:18px 0 4px;height:4px;background:#ffffff33;border-radius:4px;position:relative;cursor:pointer}
.prog span{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:4px}
.prog span::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:11px;color:#cfe3d6}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctrls .icon-btn{color:#fff;width:48px;height:48px}
.ctrls .icon-btn svg{width:30px;height:30px}
.ctrls .pp{width:66px;height:66px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.ctrls .pp svg{width:32px;height:32px}
.livepill{display:inline-flex;align-items:center;gap:6px;background:#0005;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;margin-top:18px;align-self:flex-start}
.toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.awsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.awsum .kpi{padding:12px 14px}
.awsum .kpi b{font-size:22px}
.awg{margin-top:18px}
.awgh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.awgh .t{min-width:0;flex:1}
.awgh b{display:block;font-size:16px;font-weight:800}
.awgh i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.awgh.plain{flex-wrap:wrap;gap:4px 8px}
.awgh.plain b{font-size:18px}
.awgh.plain i{flex-basis:100%;margin:0}
.awtype{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px}
.awlist{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:2px 14px}
.awrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.awrow:last-child{border-bottom:0}
.awrow .t{min-width:0;flex:1}
.awrow b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.awrow i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.awimg{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.awimg img{max-width:34px;max-height:34px;object-fit:contain}
.awimg.photo img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.awrow{color:inherit;text-decoration:none}
.awimg.mono{font-size:13px;font-weight:800;box-shadow:none}
.awres{flex:none;font-size:11px;font-weight:700;color:var(--muted);border-radius:999px;padding:5px 9px;box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.awres.won{color:var(--accent-ink);background:var(--accent);box-shadow:none}
.ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="view" id="view"></main>

  <div class="mini" id="mini">
    <img id="miniArt" alt="">
    <div class="t"><b id="miniTitle"></b><i id="miniSub"></i></div>
    <button class="icon-btn" id="miniLike" aria-label="Curtir"></button>
    <button class="icon-btn" id="miniPlay" aria-label="Tocar/pausar" style="color:var(--text)"></button>
    <div class="bar"><span id="miniBar"></span></div>
  </div>

  <nav class="nav" id="nav">
    <button data-tab="streams" class="on"><svg class="ln" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Streams</button>
    <button data-tab="home"><svg class="ln" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Ouvir</button>
    <button data-tab="search"><svg class="ln" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Buscar</button>
    <button data-tab="awards"><svg class="ln" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Prêmios</button>
  </nav>

  <section class="full" id="full" aria-hidden="true">
    <div class="fh">
      <button class="icon-btn" id="fullClose" style="color:#fff" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M12 15.6 4.7 8.3l1.4-1.4 5.9 5.9 5.9-5.9 1.4 1.4z"/></svg></button>
      <div>Tocando de<b id="fullFrom"></b></div>
      <span style="width:36px"></span>
    </div>
    <img class="art" id="fullArt" alt="">
    <div class="ti">
      <div><h3 id="fullTitle"></h3><p id="fullSub"></p></div>
      <button class="icon-btn" id="fullLike" aria-label="Curtir"></button>
    </div>
    <div id="progWrap">
      <div class="prog" id="prog"><span id="progFill"></span></div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div id="liveWrap" class="livepill" style="display:none"><span class="dot"></span>AO VIVO · <span id="liveVotes"></span></div>
    <div class="ctrls">
      <button class="icon-btn" id="btnShuffle" aria-label="Aleatório"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-8 9H3v-2h2.6l8-9H17zm0 10l4 4-4 4v-3h-3.4l-2.2-2.5 1.3-1.5 1.8 2H17zM3 7h3.4l2.2 2.5-1.3 1.5-1.8-2H3z"/></svg></button>
      <button class="icon-btn" id="btnPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
      <button class="pp" id="btnPlay" aria-label="Tocar/pausar"></button>
      <button class="icon-btn" id="btnNext" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zm-1.5 7L5 19V5z"/></svg></button>
      <button class="icon-btn" id="btnRepeat" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    </div>
  </section>
  <div class="toast" id="toast"></div>
</div>
<audio id="audio" preload="none"></audio>

<script>
/* ---------- ícones ---------- */
const I = {
  play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11zm0-2.4c2.4-1.7 6-4.9 6-8.6a2.5 2.5 0 0 0-4.6-1.3L12 10.6l-1.4-1.9A2.5 2.5 0 0 0 6 10c0 3.7 3.6 6.9 6 8.6z"/></svg>',
  heartOn:'<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',
  back:'<svg class="ln" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M15 18l-6-6 6-6"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  img:'<svg class="ln" viewBox="0 0 24 24" style="stroke-width:2.2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  plus:'<svg class="ln" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M12 5v14M5 12h14"/></svg>',
  right:'<svg class="ln" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  search:'<svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6z"/></svg>',
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Teste local (node server.js) tem proxy; online (GitHub Pages / APK) acessa direto.
const HAS_PROXY = ['localhost', '127.0.0.1'].includes(location.hostname);
const viaProxy = u => (u && HAS_PROXY && /^https:\/\/[^/]+\.(mzstatic\.com|spotifycdn\.com|scdn\.co)\//.test(u)) ? '/img?url=' + encodeURIComponent(u) : u;
const dataJSON = p => fetch('data/' + p, {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const big = (u, n=600) => u ? viaProxy(u.replace(/\/\d+x\d+(bb)?\.(jpg|png|webp)/, `/${n}x${n}bb.jpg`)) : '';
const fmt = s => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function ago(ts){ const s=Math.round((Date.now()-ts)/1000); return s<5?'agora':s<60?`há ${s}s`:`há ${Math.floor(s/60)} min`; }

/* ---------- fontes de dados ---------- */
// fetch com fallback JSONP (iTunes aceita ?callback=)
let jsonpN = 0;
function jsonp(url){
  return new Promise((ok, fail) => {
    const cb = '__cb' + (++jsonpN), s = document.createElement('script');
    window[cb] = d => { ok(d); delete window[cb]; s.remove(); };
    s.onerror = () => { fail(new Error('jsonp')); delete window[cb]; s.remove(); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
// Hosts da Apple passam pelo proxy do server.js (sem CORS no navegador)
const PROXIED = /^https:\/\/(itunes\.apple\.com|rss\.applemarketingtools\.com)\//;
async function getJSON(url, allowJsonp){
  if (PROXIED.test(url) && HAS_PROXY) {
    try { const r = await fetch('/proxy?url=' + encodeURIComponent(url)); if (r.ok) return await r.json(); } catch {}
  }
  try { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return await r.json(); }
  catch (e) { if (allowJsonp) return jsonp(url); throw e; }
}
const cache = new Map();
async function cached(key, ttl, fn){
  const c = cache.get(key);
  if (c && Date.now() - c.t < ttl) return c.v;
  const v = await fn(); cache.set(key, {t:Date.now(), v}); return v;
}

const API = {
  itunes(params){
    const q = new URLSearchParams({country:'BR', lang:'pt_br', ...params});
    return getJSON('https://itunes.apple.com/search?' + q, true).then(d => d.results || []);
  },
  lookup(params){
    const q = new URLSearchParams({country:'BR', ...params});
    return getJSON('https://itunes.apple.com/lookup?' + q, true).then(d => d.results || []);
  },
  // Paradas da Apple Music Brasil: coletadas pelo GitHub Actions em data/charts.json
  charts(){ return cached('charts', 5*60e3, () => dataJSON('charts.json').catch(() => ({}))); },
  async topSongs(){
    const c = await API.charts();
    return c.songs?.length ? c.songs : API.itunes({term:'top brasil', media:'music', entity:'song', limit:30});
  },
  async topAlbums(){
    const c = await API.charts();
    return c.albums?.length ? c.albums : API.itunes({term:'sertanejo', entity:'album', limit:20});
  },
  async topPodcasts(){
    const c = await API.charts();
    return c.podcasts?.length ? c.podcasts : API.itunes({term:'podcast', media:'podcast', limit:20});
  },
  // Rádios ao vivo — Radio Browser (comunidade, sem chave)
  radioHost: null,
  async radios(order='clicktrend', limit=20){
    const hosts = ['de1.api.radio-browser.info','fi1.api.radio-browser.info','de2.api.radio-browser.info','nl1.api.radio-browser.info'];
    const q = `countrycode=BR&order=${order}&reverse=true&limit=${limit}&hidebroken=true&is_https=true`;
    for (const h of (API.radioHost ? [API.radioHost, ...hosts] : hosts)){
      try { const d = await getJSON(`https://${h}/json/stations/search?${q}`); API.radioHost = h; return d; } catch {}
    }
    throw new Error('radio');
  },
  async searchRadios(term){
    const h = API.radioHost || 'de1.api.radio-browser.info';
    return getJSON(`https://${h}/json/stations/search?name=${encodeURIComponent(term)}&countrycode=BR&order=clickcount&reverse=true&limit=10&hidebroken=true`);
  },
  radioClick(uuid){ const h = API.radioHost || 'de1.api.radio-browser.info'; fetch(`https://${h}/json/url/${uuid}`).catch(()=>{}); },
};

/* ---------- normalização ---------- */
const songItem = r => ({ kind:'song', id:'s'+r.trackId, title:r.trackName, sub:r.artistName, art:big(r.artworkUrl100), url:r.previewUrl, albumId:r.collectionId, dur:30 });
const episodeItem = (r, pod) => ({ kind:'episode', id:'e'+r.trackId, title:r.trackName, sub:pod?.collectionName || r.collectionName, art:big(r.artworkUrl600 || r.artworkUrl160 || pod?.artworkUrl100), url:r.episodeUrl, dur:(r.trackTimeMillis||0)/1000, date:r.releaseDate, desc:r.description || r.shortDescription });
const radioItem = s => ({ kind:'radio', id:'r'+s.stationuuid, uuid:s.stationuuid, title:s.name.trim(), sub:[s.state, s.tags?.split(',').slice(0,2).join(' · ')].filter(Boolean).join(' · ') || 'Rádio', art:s.favicon, url:s.url_resolved || s.url, votes:s.votes, clicks:s.clickcount, trend:s.clicktrend });

/* ---------- estado ---------- */
const S = {
  tab:'streams', stack:[], filter:'all', period: store.get('period', 'day'),
  liked: store.get('liked', []),          // itens curtidos
  follows: store.get('follows', []),      // podcasts seguidos
  recents: store.get('recents', []),      // tocados recentemente
  queue:[], qi:-1, cur:null, from:'', shuffle:false, repeat:false,
  radioPrev: {}, lastUpdate: 0,
};
const isLiked = id => S.liked.some(x => x.id === id);
function toggleLike(item){
  if (!item) return;
  if (isLiked(item.id)) { S.liked = S.liked.filter(x => x.id !== item.id); toast('Removido das curtidas'); }
  else { S.liked.unshift(item); toast('Adicionado às curtidas'); }
  store.set('liked', S.liked); syncPlayerUI(); if (S.stack[S.stack.length-1]?.type==='library') render();
}
function pushRecent(entry){
  S.recents = [entry, ...S.recents.filter(x => x.key !== entry.key)].slice(0, 8);
  store.set('recents', S.recents);
}

/* ---------- player ---------- */
const audio = $('#audio');
function playQueue(list, i, from){
  S.queue = list; S.qi = i; S.from = from || ''; loadCur();
}
function loadCur(){
  const it = S.queue[S.qi]; if (!it) return;
  S.cur = it;
  if (!it.url){ toast('Sem áudio disponível'); return; }
  audio.src = it.url; audio.play().catch(()=>toast('Não foi possível tocar este áudio'));
  if (it.kind === 'radio') { API.radioClick(it.uuid); pushRecent({key:it.id, type:'radio', title:it.title, art:it.art, item:it}); }
  syncPlayerUI(); refreshPlayingRows();
}
function next(){ if (!S.queue.length) return;
  if (S.shuffle) S.qi = Math.floor(Math.random()*S.queue.length);
  else if (S.qi < S.queue.length-1) S.qi++; else if (S.repeat) S.qi = 0; else return;
  loadCur(); }
function prev(){ if (audio.currentTime > 3 && S.cur?.kind!=='radio'){ audio.currentTime = 0; return; } if (S.qi > 0){ S.qi--; loadCur(); } }
function togglePlay(){ if (!S.cur) return; audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
audio.addEventListener('play', syncPlayerUI);
audio.addEventListener('pause', syncPlayerUI);
audio.addEventListener('ended', next);
audio.addEventListener('error', () => { if (S.cur) toast('Falha ao carregar o áudio'); });
audio.addEventListener('timeupdate', () => {
  const d = isFinite(audio.duration) ? audio.duration : (S.cur?.dur || 0);
  const p = d ? Math.min(100, audio.currentTime/d*100) : 0;
  $('#miniBar').style.width = (S.cur?.kind==='radio' ? 100 : p) + '%';
  $('#progFill').style.width = p + '%';
  $('#tCur').textContent = fmt(audio.currentTime); $('#tDur').textContent = fmt(d);
});
$('#prog').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); const d = audio.duration; if (isFinite(d)) audio.currentTime = (e.clientX - r.left)/r.width*d; };

function syncPlayerUI(){
  const it = S.cur; if (!it) return;
  const playing = !audio.paused;
  $('#mini').classList.add('show');
  $('#miniArt').src = it.art || ''; $('#miniTitle').textContent = it.title; $('#miniSub').textContent = it.sub;
  $('#miniPlay').innerHTML = playing ? I.pause : I.play;
  const liked = isLiked(it.id);
  for (const b of [$('#miniLike'), $('#fullLike')]) { b.innerHTML = liked ? I.heartOn : I.heart; b.classList.toggle('on', liked); }
  $('#fullArt').src = it.art || ''; $('#fullArt').classList.toggle('radio-art', it.kind==='radio');
  $('#fullTitle').textContent = it.title; $('#fullSub').textContent = it.sub;
  $('#fullFrom').textContent = S.from;
  $('#btnPlay').innerHTML = playing ? I.pause : I.play;
  const live = it.kind === 'radio';
  $('#progWrap').style.display = live ? 'none' : '';
  $('#liveWrap').style.display = live ? 'inline-flex' : 'none';
  if (live) $('#liveVotes').textContent = `${(it.clicks||0).toLocaleString('pt-BR')} ouvintes hoje`;
  $('#btnShuffle').classList.toggle('on', S.shuffle); $('#btnRepeat').classList.toggle('on', S.repeat);
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({title:it.title, artist:it.sub, artwork: it.art ? [{src:it.art, sizes:'600x600'}] : []});
  }
}
function refreshPlayingRows(){
  document.querySelectorAll('[data-pid]').forEach(el => el.classList.toggle('playing', el.dataset.pid === S.cur?.id));
}
$('#mini').onclick = e => { if (e.target.closest('button')) return; openFull(true); };
$('#miniPlay').onclick = togglePlay; $('#btnPlay').onclick = togglePlay;
$('#miniLike').onclick = () => toggleLike(S.cur); $('#fullLike').onclick = () => toggleLike(S.cur);
$('#btnNext').onclick = next; $('#btnPrev').onclick = prev;
$('#btnShuffle').onclick = () => { S.shuffle = !S.shuffle; syncPlayerUI(); };
$('#btnRepeat').onclick = () => { S.repeat = !S.repeat; syncPlayerUI(); };
$('#fullClose').onclick = () => openFull(false);
function openFull(v){ $('#full').classList.toggle('show', v); $('#full').setAttribute('aria-hidden', !v); }
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('nexttrack', next);
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}

/* ---------- navegação ---------- */
const view = $('#view');
$('#nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; S.stack = []; render(); };
function go(screen){ S.stack.push(screen); render(); }
function back(){ S.stack.pop(); render(); }
let renderId = 0;
function render(){
  const id = ++renderId;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  view.scrollTop = 0;
  const top = S.stack[S.stack.length-1];
  const fn = top ? Screens[top.type] : Screens[S.tab];
  fn(top || {}, () => id === renderId);
}

/* ---------- blocos de UI ---------- */
const ph = n => Array.from({length:n}, () => '<div class="tile"><div class="ph"></div><b>&nbsp;</b></div>').join('');
const phRows = n => Array.from({length:n}, () => '<div class="row"><div class="ph"></div><div class="t"><b class="ph" style="height:12px;width:60%;border-radius:4px"></b></div></div>').join('');
const img = (src, alt='') => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;ph&quot; style=&quot;animation:none&quot;></div>'">` : '<div class="ph" style="animation:none"></div>';
function songRows(list, from, numbered){
  return list.map((s, i) => `
    <div class="row" data-play="${i}">
      ${numbered ? `<span class="num">${i+1}</span>` : ''}
      ${img(s.art)}
      <div class="t"><b data-pid="${s.id}" class="${S.cur?.id===s.id?'playing':''}">${esc(s.title)}</b><i>${esc(s.sub)}</i></div>
      <button class="icon-btn ${isLiked(s.id)?'on':''}" data-like="${i}" aria-label="Curtir">${isLiked(s.id)?I.heartOn:I.heart}</button>
    </div>`).join('');
}
function bindSongRows(root, list, from){
  root.querySelectorAll('[data-play]').forEach(el => el.onclick = e => {
    const lk = e.target.closest('[data-like]');
    if (lk) { toggleLike(list[+lk.dataset.like]); const on = isLiked(list[+lk.dataset.like].id); lk.innerHTML = on?I.heartOn:I.heart; lk.classList.toggle('on', on); return; }
    playQueue(list, +el.dataset.play, from);
  });
}

/* ---------- busca ---------- */
async function doSearch(term, alive){
  const box = $('#sres'); if (!box) return;
  if (!term) { render(); return; }
  box.innerHTML = `<h2>Músicas</h2>${phRows(5)}`;
  try {
    const [songs, albums, pods, radios] = await Promise.all([
      API.itunes({term, media:'music', entity:'song', limit:10}),
      API.itunes({term, entity:'album', limit:10}),
      API.itunes({term, media:'podcast', limit:8}),
      API.searchRadios(term).catch(() => []),
    ]);
    if (!alive() || $('#q')?.value.trim() !== term) return;
    const items = songs.filter(s => s.previewUrl).map(songItem);
    const rad = radios.map(radioItem);
    box.innerHTML = `
      ${items.length ? `<h2>Músicas</h2><div id="ss">${songRows(items)}</div>` : ''}
      ${albums.length ? `<h2>Álbuns</h2><div class="shelf" id="sa">${albums.map((a,i) => `<button class="tile" data-i="${i}">${img(big(a.artworkUrl100,400))}<b>${esc(a.collectionName)}</b><i>${esc(a.artistName)}</i></button>`).join('')}</div>` : ''}
      ${pods.length ? `<h2>Podcasts</h2><div class="shelf" id="sp">${pods.map((p,i) => `<button class="tile" data-i="${i}">${img(big(p.artworkUrl600||p.artworkUrl100,400))}<b>${esc(p.collectionName)}</b><i>${esc(p.artistName)}</i></button>`).join('')}</div>` : ''}
      ${rad.length ? `<h2>Rádios</h2><div id="sr">${rad.map((s,i) => `<button class="row" data-i="${i}">${img(s.art)}<div class="t"><b data-pid="${s.id}">${esc(s.title)}</b><i>Rádio ao vivo · ${esc(s.sub)}</i></div></button>`).join('')}</div>` : ''}
      ${!items.length && !albums.length && !pods.length && !rad.length ? `<p class="empty">Nada encontrado para “${esc(term)}”.</p>` : ''}`;
    if ($('#ss')) bindSongRows($('#ss'), items, `Busca: ${term}`);
    if ($('#sa')) $('#sa').onclick = e => { const b = e.target.closest('[data-i]'); if (b) go({type:'album', id:albums[+b.dataset.i].collectionId}); };
    if ($('#sp')) $('#sp').onclick = e => { const b = e.target.closest('[data-i]'); if (b) go({type:'podcast', id:pods[+b.dataset.i].collectionId}); };
    if ($('#sr')) $('#sr').onclick = e => { const b = e.target.closest('[data-i]'); if (b) playQueue(rad, +b.dataset.i, 'Rádio ao vivo'); };
  } catch { if (alive()) box.innerHTML = '<p class="empty">Erro na busca. Verifique sua conexão.</p>'; }
}

/* ---------- rádios na home (tempo real) ---------- */
function loadRadios(alive){
  const run = async () => {
    try {
      const list = (await API.radios('clicktrend', 15)).map(radioItem);
      const el = $('#radios'); if (!alive() || !el) return;
      const prev = S.radioPrev;
      el.innerHTML = list.map((s,i) => {
        const was = prev[s.id];
        const mv = was === undefined ? '' : was > i ? `<span class="rank up">▲${was-i}</span>` : was < i ? `<span class="rank down">▼${i-was}</span>` : '';
        return `<button class="radio ${was!==undefined && was!==i?'flash':''}" data-i="${i}"><span class="badge">AO VIVO</span>${img(s.art)}<b data-pid="${s.id}" class="${S.cur?.id===s.id?'playing':''}">${esc(s.title)}</b><i>${mv} ${s.trend>0?'+':''}${s.trend} ouvintes hoje</i></button>`;
      }).join('');
      S.radioPrev = Object.fromEntries(list.map((s,i) => [s.id, i]));
      el.onclick = e => { const b = e.target.closest('[data-i]'); if (b) playQueue(list, +b.dataset.i, 'Rádios ao vivo'); };
      S.lastUpdate = Date.now();
    } catch { const el = $('#radios'); if (alive() && el) el.innerHTML = '<p class="err">Serviço de rádios indisponível. Tentando de novo…</p>'; }
  };
  run(); poll(alive, run);
}

/* ---------- loop de atualização ---------- */
function poll(alive, fn){
  const h = setInterval(() => { if (!alive()) return clearInterval(h); if (!document.hidden) fn(); }, 30000);
}
setInterval(() => { const u = $('#upd'); if (u) u.textContent = S.lastUpdate ? `atualizado ${ago(S.lastUpdate)}` : 'carregando…'; }, 1000);
// a cada 5 min, renova as paradas na home (cache expira)
setInterval(() => { if (S.tab==='home' && !S.stack.length && !document.hidden) { cache.delete('top'); } }, 5*60e3);

<script>
/* =================== STREAMS: acompanhamento diário =================== */
const P = { day:{label:'Diário', short:'Hoje', days:1}, week:{label:'Semanal', short:'7 dias', days:7}, month:{label:'Mensal', short:'30 dias', days:30} };
const nf = new Intl.NumberFormat('pt-BR');
function fmtN(n){
  if (n == null) return '—';
  const a = Math.abs(n), f = (v, d) => v.toLocaleString('pt-BR', {maximumFractionDigits:d, minimumFractionDigits:0});
  if (a >= 1e9) return f(n/1e9, 2) + ' bi';
  if (a >= 1e6) return f(n/1e6, a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2) + ' mi';
  if (a >= 1e3) return f(n/1e3, 0) + ' mil';
  return nf.format(n);
}
const fmtDate = d => { const [y,m,dd] = d.split('-'); return `${dd}/${m}`; };
const fmtDateLong = d => new Date(d+'T12:00:00Z').toLocaleDateString('pt-BR', {day:'2-digit', month:'short', year:'numeric'});
function chg(c){ if (c == null) return ''; const up = c >= 0; return `<span class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(c*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</span>`; }
function coverage(st){ return st.complete ? '' : `<span class="note">parcial · ${st.covered} de ${st.days} dias coletados</span>`; }
const pic = u => esc(viaProxy(u) || '');
const toSeries = arr => arr.map(([date, t, d]) => ({date, t, d}));
// Pedidos de adicionar/remover viram uma issue no repositório; o GitHub Actions processa.
// Com a chave do GitHub salva no aparelho, o app cria a issue sozinho (sem abrir o GitHub).
let REPO = null;
const GH_KEY = 'ghToken';
async function issueLink(action, id, name){
  if (!REPO) { toast('Disponível na versão online (GitHub)'); return; }
  const title = `${action} ${id}: ${name}`;
  const body = `Pedido feito pelo app Sintonia.\n\nA coleta roda e a lista de artistas é atualizada em ~2 minutos.`;
  const tok = store.get(GH_KEY, null);
  if (!tok) return go({type:'ghsetup', pending:{action, id, name}});
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues`, { method: 'POST',
      headers: { Authorization: `Bearer ${tok}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body }) });
    if (r.ok) { toast(action === 'Remover' ? `Removendo ${name}… some da lista em ~2 min` : `Adicionando ${name}… aparece em ~2 min`); return true; }
    if (r.status === 401 || r.status === 403 || r.status === 404) { toast('A chave do GitHub não funcionou. Confira e salve de novo.'); return go({type:'ghsetup', pending:{action, id, name}, bad:true}); }
    toast(`GitHub respondeu ${r.status}. Tente de novo em instantes.`);
  } catch { toast('Sem conexão com o GitHub. Tente de novo.'); }
}
function issueOpen(action, id, name){
  const title = `${action} ${id}: ${name}`, body = 'Pedido feito pelo app Sintonia.';
  window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, '_blank');
  toast('Envie a issue no GitHub para confirmar');
}
function nextRun(){ const n = new Date(); const h = n.getUTCHours(); const d = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), n.getUTCMinutes() < 45 ? h : h + 1, 45)); return d; }
let INDEX = null;
async function searchIndex(q){
  INDEX ??= await dataJSON('artist-index.json').catch(() => []);
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(), nq = norm(q);
  return INDEX.filter(a => norm(a[1]).includes(nq)).slice(0, 15).map(([id, name, totalM]) => ({id, name, totalM}));
}
function periodSeg(onChange){
  return `<div class="seg" id="seg" role="tablist" aria-label="Período">${Object.keys(P).map(k => `<button role="tab" aria-selected="${S.period===k}" data-p="${k}" class="${S.period===k?'on':''}">${SEG_LABEL[k]}</button>`).join('')}</div>`;
}
function bindSeg(after){ $('#seg').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; S.period = b.dataset.p; store.set('period', S.period); after(); }; }

/* ---------- agregação para o gráfico ---------- */
function buckets(series, period){
  const DAYMS = 864e5, T = d => Date.parse(d+'T00:00:00Z');
  if (!series.length) return [];
  if (period === 'day') return series.slice(-30).map(s => ({label:fmtDate(s.date), full:fmtDateLong(s.date), v:s.d, partial:false}));
  if (period === 'week'){
    const lastT = T(series[series.length-1].date), map = new Map();
    for (const s of series){ const k = Math.floor((lastT - T(s.date))/(7*DAYMS)); const b = map.get(k) || {v:0,n:0,end:s.date,start:s.date}; b.v += s.d; b.n++; if (s.date > b.end) b.end = s.date; if (s.date < b.start) b.start = s.date; map.set(k, b); }
    return [...map.entries()].sort((a,b) => b[0]-a[0]).slice(-12).map(([,b]) => ({label:fmtDate(b.end), full:`Semana até ${fmtDateLong(b.end)} (${b.n} de 7 dias)`, v:b.v, partial:b.n<7}));
  }
  const map = new Map();
  for (const s of series){ const k = s.date.slice(0,7); const b = map.get(k) || {v:0,n:0}; b.v += s.d; b.n++; map.set(k, b); }
  return [...map.entries()].sort().slice(-12).map(([k,b]) => {
    const [y,m] = k.split('-').map(Number), dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const name = new Date(Date.UTC(y, m-1, 15)).toLocaleDateString('pt-BR',{month:'short', year:'2-digit'});
    return {label:name, full:`${name} (${b.n} de ${dim} dias)`, v:b.v, partial:b.n<dim};
  });
}

/* ---------- gráfico de barras (série única, tooltip por barra) ---------- */
function barChart(series, period, title){
  const data = buckets(series, period);
  const W = 360, H = 170, L = 38, R = 6, TOP = 8, B = 20;
  const max = Math.max(1, ...data.map(d => d.v));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1,2,2.5,5,10]) if (m*p >= max) return m*p; return max; })();
  const n = Math.max(data.length, period==='day' ? 7 : 4), slot = (W-L-R)/n, bw = Math.min(26, slot-2);
  const y = v => TOP + (H-TOP-B) * (1 - v/nice);
  let g = '';
  for (let i = 0; i <= 2; i++){ const v = nice*i/2, yy = y(v); g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="axis" x="${L-5}" y="${yy+3}" text-anchor="end">${fmtN(v).replace(' ','')}</text>`; }
  const every = Math.ceil(data.length / 6);
  const bars = data.map((d,i) => {
    const x = L + slot*i + (slot-bw)/2, yy = y(d.v), h = Math.max(0, H-B-yy), r = Math.min(4, bw/2, h);
    const path = `M${x},${H-B}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${H-B}Z`;
    const lbl = (i % every === 0 || i === data.length-1) ? `<text class="axis" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${d.label}</text>` : '';
    return `<rect class="hit" data-i="${i}" x="${L+slot*i}" y="${TOP}" width="${slot}" height="${H-TOP-B}" fill="transparent"/><path class="bar ${d.partial?'partial':''}" d="${path}"/>${lbl}`;
  }).join('');
  const id = 'c' + Math.random().toString(36).slice(2,7);
  const note = data.length <= 1 ? `<p class="note" style="margin:4px 4px 6px">O gráfico ganha uma barra a cada dia coletado. Barras claras = período ainda incompleto.</p>` : (data.some(d=>d.partial) ? `<p class="note" style="margin:4px 4px 6px">Barras claras = período ainda incompleto.</p>` : '');
  setTimeout(() => {
    const root = document.getElementById(id); if (!root) return;
    const tip = root.querySelector('.tip'), svg = root.querySelector('svg');
    const show = el => { const d = data[+el.dataset.i]; const r = svg.getBoundingClientRect(), rr = root.getBoundingClientRect(), br = el.getBoundingClientRect();
      root.querySelectorAll('.bar').forEach((b,j) => b.classList.toggle('hl', j === +el.dataset.i));
      tip.innerHTML = `<b>${nf.format(d.v)}</b>${d.full}`; tip.style.display = 'block';
      tip.style.left = Math.min(rr.width-70, Math.max(70, br.left - rr.left + br.width/2)) + 'px'; tip.style.top = (y(d.v)/H*r.height + r.top - rr.top - 6) + 'px'; };
    const hide = () => { tip.style.display = 'none'; root.querySelectorAll('.bar.hl').forEach(b => b.classList.remove('hl')); };
    root.querySelectorAll('.hit').forEach(h => { h.onmouseenter = () => show(h); h.onclick = () => show(h); });
    svg.onmouseleave = hide;
    root.querySelector('[data-tbl]').onclick = e => { const t = root.querySelector('.tbl'); t.hidden = !t.hidden; e.target.textContent = t.hidden ? 'Ver tabela' : 'Ver gráfico'; svg.style.display = t.hidden ? '' : 'none'; };
  });
  return `<div class="chart" id="${id}"><h3>${esc(title)}<button data-tbl>Ver tabela</button></h3>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}${bars}</svg><div class="tip"></div>
    <table class="tbl" hidden>${data.slice().reverse().map(d => `<tr><td>${esc(d.full)}</td><td>${nf.format(d.v)}</td></tr>`).join('')}</table>${note}</div>`;
}

const SEG_LABEL = {day:'Dia', week:'Semana', month:'Mês'};

}
const badge = c => c == null ? '' : `<span class="badge2 ${c >= 0 ? 'up' : 'down'}">${c >= 0 ? '▲' : '▼'} ${Math.abs(c*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</span>`;

function itemList(items, kind, artistId, limit){

}

const SVC_LABEL = {spotify:'Spotify', apple:'Apple Music', itunes:'iTunes'};
const regionName = (() => { let dn; try { dn = new Intl.DisplayNames(['pt-BR'], {type:'region'}); } catch {} return (cc, fb) => { if (cc === 'global' || cc === 'ww') return 'Global'; try { return (cc.length === 2 && dn?.of(cc.toUpperCase())) || fb; } catch { return fb; } }; })();

  const m = /^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}) (EST|EDT)$/.exec(s || ''); return m ? new Date(`${m[1]}T${m[2]}:00${m[3]==='EDT'?'-04:00':'-05:00'}`) : null;

let chartSvc = null, chartAll = false;
function chartsBlock(d, isAlbum){
  const c = d.charts;

}
function chartsInner(c, isAlbum){
  const svcs = Object.keys(SVC_LABEL).filter(k => c.list[k]?.length);

  const head = `<h2>Charts agora <small style="display:flex;align-items:center;gap:6px">${when ? '<span class="dot"></span>atualizado ' + when.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : ''}</small></h2>`;
  if (!svcs.length) return head + `<p class="note">${isAlbum ? 'Este álbum' : 'Esta música'} não está em nenhum chart do Spotify, Apple Music ou iTunes agora.</p>`;

    <div class="chips" id="csvc" style="margin-bottom:6px">${svcs.map(k => `<button class="chip ${k===chartSvc?'on':''}" data-svc="${k}">${SVC_LABEL[k]} · ${c.list[k].length}</button>`).join('')}</div>
    <div class="cbox">

/* ---------- cor dominante da capa (para o estilo "Cores da capa" e o vinil) ---------- */
function palette(im){
  if (!im) return null;
  const c = document.createElement('canvas'); c.width = c.height = 28;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0, 28, 28);
  let px; try { px = g.getImageData(0, 0, 28, 28).data; } catch { return null; }
  const bins = Array.from({length: 18}, () => ({w:0, r:0, g:0, b:0}));
  let lum = 0;
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i]/255, gg = px[i+1]/255, b = px[i+2]/255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = (mx + mn)/2, d = mx - mn;
    lum += l;
    if (l < 0.1 || l > 0.93 || d < 0.08) continue;
    const s = d / (1 - Math.abs(2*l - 1));
    let h = mx === r ? ((gg - b)/d) % 6 : mx === gg ? (b - r)/d + 2 : (r - gg)/d + 4; h = (h/6 + 1) % 1;
    const w = s*s*(1 - Math.abs(l - 0.5)), k = Math.floor(h*18) % 18;
    bins[k].w += w; bins[k].r += r*w; bins[k].g += gg*w; bins[k].b += b*w;
  }
  const best = bins.reduce((a, b) => b.w > a.w ? b : a);
  if (best.w < 0.4) return { h: 0.08, s: 0.12, l: 0.4, gray: true }; // capa quase sem cor
  const r = best.r/best.w, gg = best.g/best.w, b = best.b/best.w, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = (mx + mn)/2, d = mx - mn;
  let h = mx === r ? ((gg - b)/d) % 6 : mx === gg ? (b - r)/d + 2 : (r - gg)/d + 4; h = (h/6 + 1) % 1;
  return { h, s: Math.min(0.85, Math.max(0.35, d / (1 - Math.abs(2*l - 1)))), l };
}

function imgSquare(ctx, im, x, y, s, fallback){ if (im) coverDraw(ctx, im, x, y, s, s); else { ctx.fillStyle = fallback; ctx.fillRect(x, y, s, s); } }

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 40*u; ctx.shadowOffsetY = 14*u;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = '#c9ced3'; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.arc(cx, cy, r*0.075, 0, 7, true); ctx.clip('evenodd');
  const g = ctx.createRadialGradient(cx, cy, r*0.1, cx, cy, r); g.addColorStop(0, '#eef1f4'); g.addColorStop(1, '#aeb4ba');
  ctx.fillStyle = g; ctx.fillRect(cx-r, cy-r, 2*r, 2*r);

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, outer, 0, 7); ctx.arc(cx, cy, inner, 0, 7, true); ctx.clip('evenodd');
  ctx.translate(cx, cy); ctx.rotate(angle); imgSquare(ctx, im, -outer, -outer, 2*outer, '#333'); ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, inner, 0, 7); ctx.arc(cx, cy, r*0.075, 0, 7, true);
  ctx.fillStyle = 'rgba(225,232,238,.55)'; ctx.fill('evenodd');
  ctx.beginPath(); ctx.arc(cx, cy, r*0.2, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2*u; ctx.stroke();
  if (ctx.createConicGradient){
    const s = ctx.createConicGradient(-0.6, cx, cy);
    [[0,'rgba(255,255,255,0)'],[.08,'rgba(255,255,255,.32)'],[.13,'rgba(120,220,255,.18)'],[.2,'rgba(255,255,255,0)'],
     [.5,'rgba(255,255,255,0)'],[.58,'rgba(255,255,255,.28)'],[.63,'rgba(255,170,240,.16)'],[.7,'rgba(255,255,255,0)'],[1,'rgba(255,255,255,0)']].forEach(([o,c]) => s.addColorStop(o, c));
    ctx.fillStyle = s; ctx.fillRect(cx-r, cy-r, 2*r, 2*r);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r - u, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2*u; ctx.stroke();
}
// textura de vinil marmorizado na cor da capa (gerada uma vez por arte)
function vinylTexture(R, size, key){
  R.vtex ??= {};

  const base = p.gray ? hsl(h, 0.02, 0.1) : hsl(h, s, 0.33);

  for (let k = 0; k < 18; k++) { g.beginPath(); g.arc(S/2, S/2, S*(0.18 + rnd()*0.32), 0, 7); g.lineWidth = S*(0.01 + rnd()*0.03); g.strokeStyle = rnd() < 0.5 ? hsl(h, s, 0.42, 0.25) : hsl(h, s, 0.18, 0.35); g.stroke(); }
  // veios esfumaçados que acompanham o giro do disco (como vinil marmorizado)
  const dark = i => p.gray ? `rgba(70,70,70,${0.18 + rnd()*0.25})` : hsl(h, s*0.9, 0.07, 0.18 + rnd()*0.3);
  g.filter = `blur(${Math.max(2, S/160)}px)`;

function drawCase(ctx, x, y, c, im, u){

  const g = ctx.createLinearGradient(x, 0, x + sp, 0); g.addColorStop(0, '#0e0e0e'); g.addColorStop(.6, '#2b2b2b'); g.addColorStop(1, '#111');

}

// desenha a arte escolhida dentro do quadrado (x, y, s); a = progresso de entrada, spin = ângulo do disco

    ctx.restore();
  } else {
    const rad = round ? s/2 : 18*u;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50*u; ctx.shadowOffsetY = 20*u;

  }
}

/* ---------- preparo (imagens, cores, fundo) ---------- */
async function prepareShare(src, o){
  const Z = SIZES[o.size], W = Z.w, H = Z.h, u = W/1080;
  await Promise.all([document.fonts.load(`800 60px ${FONT}`), document.fonts.load(`700 60px ${SERIF}`)]).catch(()=>{});
  const im = await loadImg(src.img);
  const pal = palette(im);
  const st = o.style === 'auto' ? autoStyle(pal) : STYLES[o.style];
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const b = bg.getContext('2d');
  if (st.grad){ const g = b.createLinearGradient(0, 0, W, H); g.addColorStop(0, st.grad[0]); g.addColorStop(1, st.grad[1]); b.fillStyle = g; } else b.fillStyle = st.bg;
  b.fillRect(0, 0, W, H);
  if (st.blur && im){ b.save(); b.filter = `blur(${Math.round(40*u)}px) brightness(.55)`; coverDraw(b, im, -60*u, -60*u, W+120*u, H+120*u); b.restore(); }
  const R = { W, H, u, st, im, bg, pal, key: src.title };
  if (src.kind === 'awards') {
    R.awImgs = {};
    await Promise.all(awardsSummary(src).top.map(async t => { R.awImgs[t.a] = await loadImg(src.awards?.[t.a]?.img || t.img); }));
  }
  return R;
}

// t = segundos desde o início da animação; null = arte estática (tudo no lugar)
function drawFrame(canvas, src, o, R, t){

  const { W, H, u, st, im, bg } = R;
  if (canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  const ctx = canvas.getContext('2d');

  const A = (start, dur = 0.7) => still ? 1 : easeOut(clamp01((t - start) / dur));
  const fadeIn = (a, dy = 30*u) => { ctx.globalAlpha = a; return (1 - a) * dy; };
  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  ctx.drawImage(bg, 0, 0);
  const pulse = still ? 1 : 0.75 + 0.25*Math.sin(t*1.6);
  if (o.style === 'escuro' || o.style === 'neon' || o.style === 'auto'){
    const glow = o.style === 'neon' ? 'rgba(255,61,187,' : o.style === 'auto' ? st.accent.replace(/[\d.]+\)$/, '') : 'rgba(61,220,111,';
    const g = ctx.createRadialGradient(W*.5, 0, 0, W*.5, 0, H*.8);
    g.addColorStop(0, glow + (o.style === 'auto' ? 0.18 : 0.22)*pulse + ')'); g.addColorStop(1, glow + '0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  const P = o.period, stt = src.stats[P], vertical = H/W >= 0.95;
  const M = 72*u;
  const date = src.lastDate ? new Date(src.lastDate+'T12:00:00Z').toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'}) : '—';
  const wideArt = o.art === 'cd' || o.art === 'vinil';

  let cx, cy, cs, tx, ty, tw;
  if (vertical){
    cs = Math.min(W - 2*M - (wideArt ? 0 : 140*u), H*(H/W > 1.5 ? 0.36 : H/W > 1.1 ? 0.33 : 0.3) * (wideArt ? 1.25 : 1));
    cx = (W-cs)/2; cy = M + 30*u; tx = M; tw = W - 2*M; ty = cy + cs + 90*u;
  } else { cs = Math.min(H - 2*M - 80*u, W*0.4); cx = M; cy = (H-cs)/2 - 20*u; tx = cx + cs + 64*u; tw = W - tx - M; ty = cy + 40*u; }
  const aArt = A(0, 1.1), spin = still ? 0.5 : t * 1.4;
  ctx.save();
  if (!still){ const sc = 0.88 + 0.12*easeOut(clamp01(t/0.9)); ctx.globalAlpha = clamp01(t/0.5); ctx.translate(cx + cs/2, cy + cs/2); ctx.scale(sc, sc); ctx.translate(-(cx + cs/2), -(cy + cs/2)); }

  ctx.textAlign = align;
  let dy;
  dy = fadeIn(A(0.5)); ctx.fillStyle = st.accent; ctx.font = `800 ${28*u}px ${FONT}`;
  ctx.fillText((KIND_LABEL[src.kind] + ' · Spotify').toUpperCase(), ax, ty + dy); ty += 70*u;
  dy = fadeIn(A(0.65)); ctx.fillStyle = st.text; fitFont(ctx, src.title, 800, 76*u, tw, 34*u); ctx.fillText(clip(ctx, src.title, tw), ax, ty + dy); ty += 52*u;
  if (src.artist){ dy = fadeIn(A(0.8)); ctx.fillStyle = st.muted; fitFont(ctx, src.artist, 600, 38*u, tw, 24*u); ctx.fillText(clip(ctx, src.artist, tw), ax, ty + dy); ty += 30*u; }
  ty += 80*u;

  dy = fadeIn(A(0.9, 0.4)); ctx.fillStyle = st.accent; fitFont(ctx, nf.format(stt.value), 800, (vertical ? 128 : 112)*u, tw, 48*u); ctx.fillText(big, ax, ty + dy); ty += 50*u;

  ctx.fillText(line2, ax, ty + dy); ty += 46*u;
  dy = fadeIn(A(1.5)); ctx.fillStyle = st.muted; ctx.font = `600 ${28*u}px ${FONT}`;

  if (!stt.complete) { ty += 12*u; ctx.font = `600 ${22*u}px ${FONT}`; ctx.fillText(`período parcial · ${stt.covered} de ${stt.days} dias coletados`, ax, ty + dy); ty += 20*u; }

  const footerH = 90*u, room = H - ty - footerH - 50*u, rowH = 66*u;

/* ---------- modelo TABELA: todas as faixas do álbum (ou da era), total, diário e variação ---------- */
function tableColors(R){
  const p = R.pal && !R.pal.gray ? R.pal : { h: 0.36, s: 0.55 };
  return { band: hsl(p.h, p.s*0.85, 0.17), bar: hsl(p.h, p.s*0.8, 0.33), head: hsl(p.h, p.s*0.85, 0.2), sub: hsl(p.h, p.s*0.85, 0.2), total: hsl(p.h, p.s*0.9, 0.12) };
}
function drawTable(canvas, src, o, R){
  const secs = src.sections || [];
  const W = 1080, M = 0, rowH = 50, C = [400, 230, 230, 220]; // colunas: música, total, diário, variação
  const nRows = secs.reduce((a, s) => a + s.tracks.length + 1, 0) + (secs.length > 1 ? 1 : 0);
  const HEAD = 230, BAR = 60, COLS = 60, FOOT = 74;
  const H = HEAD + BAR + COLS + nRows*rowH + FOOT;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d'), col = tableColors(R);
  ctx.textBaseline = 'middle';
  // cabeçalho
  ctx.fillStyle = col.band; ctx.fillRect(0, 0, W, HEAD);
  if (R.im) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; ctx.drawImage(R.im, 60, 35, 160, 160); ctx.restore(); }
  const title = src.tableTitle || src.title, cxT = W/2 + 40;
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = `700 34px ${SERIF}`; ctx.fillText((src.artist || src.title).toUpperCase(), cxT, 78);
  fitFont(ctx, title.toUpperCase(), 700, 76, 560, 34, SERIF); ctx.fillText(clip(ctx, title.toUpperCase(), 560), cxT, 140);
  ctx.textAlign = 'right'; ctx.font = `800 26px ${FONT}`; ctx.globalAlpha = .9; ctx.fillText('Sintonia', W - 50, 70); ctx.globalAlpha = 1;
  // faixa da data (em inglês, como o "Daily streams")
  let y = HEAD;
  const dd = src.lastDate ? new Date(src.lastDate + 'T12:00:00Z') : null;
  const dtxt = dd ? `${dd.toLocaleDateString('en-US', {weekday:'long'})} - ${dd.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})}` : '';
  ctx.fillStyle = col.bar; ctx.fillRect(0, y, W, BAR);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `800 30px ${FONT}`; ctx.fillText(dtxt, W/2, y + BAR/2 + 1); y += BAR;
  // títulos das colunas
  ctx.fillStyle = col.head; ctx.fillRect(0, y, W, COLS);
  const xs = [0, C[0], C[0]+C[1], C[0]+C[1]+C[2]], mid = i => xs[i] + C[i]/2;
  ctx.fillStyle = '#fff'; ctx.font = `800 28px ${FONT}`;
  ['Song', 'Total Streams', 'Daily Streams', 'Change'].forEach((t, i) => ctx.fillText(t, mid(i), y + COLS/2 + 1));
  y += COLS;
  const fmt = v => v == null ? '—' : nf.format(v);
  const line = (yy) => { ctx.fillStyle = 'rgba(0,0,0,.12)'; for (const x of xs.slice(1)) ctx.fillRect(x, yy, 2, rowH); };
  let gt = 0, gd = 0, gc = 0;
  secs.forEach(sec => {
    let st = 0, sd = 0, sc = 0;
    sec.tracks.forEach((t, i) => {
      ctx.fillStyle = i % 2 ? '#f0f0f0' : '#ffffff'; ctx.fillRect(0, y, W, rowH); line(y);
      ctx.fillStyle = '#111'; fitFont(ctx, t.name, 700, 28, C[0] - 30, 18); ctx.fillText(clip(ctx, t.name, C[0] - 30), mid(0), y + rowH/2 + 1);
      ctx.font = `500 28px ${FONT}`; ctx.fillText(fmt(t.total), mid(1), y + rowH/2 + 1); ctx.fillText(fmt(t.daily), mid(2), y + rowH/2 + 1);
      ctx.fillStyle = t.change == null ? '#777' : t.change >= 0 ? '#2e9d4a' : '#e0393e'; ctx.fillText(fmt(t.change), mid(3), y + rowH/2 + 1);
      st += t.total || 0; sd += t.daily || 0; sc += t.change || 0;
      y += rowH;
    });
    ctx.fillStyle = col.sub; ctx.fillRect(0, y, W, rowH);
    ctx.fillStyle = '#fff'; const lab = `${sec.name}${sec.day ? ` | Day ${sec.day}` : ''}`;
    fitFont(ctx, lab, 800, 28, C[0] - 24, 16); ctx.fillText(clip(ctx, lab, C[0] - 24), mid(0), y + rowH/2 + 1);
    ctx.font = `600 28px ${FONT}`; ctx.fillText(fmt(st), mid(1), y + rowH/2 + 1); ctx.fillText(fmt(sd), mid(2), y + rowH/2 + 1); ctx.fillText(fmt(sc), mid(3), y + rowH/2 + 1);
    y += rowH; gt += st; gd += sd; gc += sc;
  });
  if (secs.length > 1) {
    ctx.fillStyle = col.total; ctx.fillRect(0, y, W, rowH);
    ctx.fillStyle = '#fff'; ctx.font = `800 30px ${FONT}`;
    ctx.fillText('TOTAL', mid(0), y + rowH/2 + 1); ctx.fillText(fmt(gt), mid(1), y + rowH/2 + 1); ctx.fillText(fmt(gd), mid(2), y + rowH/2 + 1); ctx.fillText(fmt(gc), mid(3), y + rowH/2 + 1);
    y += rowH;
  }
  ctx.fillStyle = col.band; ctx.fillRect(0, y, W, FOOT);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `600 22px ${FONT}`; ctx.textAlign = 'left';
  ctx.fillText(`Atualização: ${dd ? dd.toLocaleDateString('pt-BR') : '—'} · streams do Spotify`, 40, y + FOOT/2);
  ctx.textAlign = 'right'; ctx.font = `800 24px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('Sintonia', W - 40, y + FOOT/2);
}

/* ---------- modelo PRÊMIOS: resumo das conquistas do artista ---------- */
const workKey = n => String(n || '').replace(/\s*\((with|feat|ft)[^)]*\)/gi, '').trim();
function awardsSummary(src){
  if (src._sum) return src._sum;
  const rows = src.rows || [], won = rows.filter(r => r.r === 'won');
  const by = (list, f) => { const m = new Map(); for (const r of list) { const k = f(r); if (!k) continue; m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const top = by(won.filter(r => r.t !== 'cert'), r => r.a).slice(0, 6).map(([a, w]) => ({ a, w, img: won.find(r => r.a === a && r.img)?.img }));
  const work = by(won.filter(r => (r.t === 'song' || r.t === 'album') && r.n), r => workKey(r.n))[0];

/* ---------- exportar: imagem (PNG) ou vídeo (MP4/WebM) ---------- */
const fileBase = name => 'sintonia-' + name.normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase().slice(0, 40);
const blobB64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
async function exportBlob(blob, file, title, kindLabel){
  const FS = capPlugin('Filesystem'), SH = capPlugin('Share');
  if (FS && SH){
    const w = await FS.writeFile({path: file, data: await blobB64(blob), directory: 'CACHE'});
    try { await SH.share({title, files: [w.uri], dialogTitle: `Compartilhar ${kindLabel}`}); }
    catch (e) { if (!/cancel/i.test(e.message || '')) throw e; }
    return;
  }
  const f = new File([blob], file, {type: blob.type});
  if (navigator.canShare?.({files:[f]})) { try { await navigator.share({files:[f], title}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`${kindLabel[0].toUpperCase() + kindLabel.slice(1)} salvo em Downloads`);
}
function videoMime(){
  if (!window.MediaRecorder) return null;
  return ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } }) || null;
}
function recordMotion(canvas, src, o, R, onProgress){
  return new Promise((ok, no) => {
    const mime = videoMime(); if (!mime || !canvas.captureStream) return no(new Error('Gravação de vídeo não suportada neste aparelho'));
    const stream = canvas.captureStream(30), chunks = [];
    const rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: 8e6});
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(tr => tr.stop()); ok(new Blob(chunks, {type: mime.split(';')[0]})); };
    rec.onerror = e => no(e.error || new Error('falha na gravação'));
    drawFrame(canvas, src, o, R, 0);
    rec.start(250);
    const t0 = performance.now();
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      drawFrame(canvas, src, o, R, Math.min(t, MOTION_SECS));
      onProgress?.(t);
      if (t < MOTION_SECS) requestAnimationFrame(tick); else setTimeout(() => rec.stop(), 120);
    };
    requestAnimationFrame(tick);
  });
}

// monta as seções da tabela a partir dos álbuns escolhidos (ordem de lançamento; faixa repetida aparece só uma vez)
async function tableSections(src, ids){
  const albums = (await Promise.all(ids.map(id => dataJSON(`artists/${src.artistId}/albums_${id}.json`).catch(() => null)))).filter(a => a?.tracks);
  albums.sort((a, b) => (a.release || '9').localeCompare(b.release || '9'));
  const seen = new Set(), key = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const last = src.lastDate ? Date.parse(src.lastDate + 'T00:00:00Z') : Date.now();
  const secs = albums.map(a => {
    const tracks = a.tracks.filter(t => { const k = key(t.name); if (seen.has(k)) return false; seen.add(k); return true; })
      .map(t => ({ name: t.name, total: t.stats?.total ?? null, daily: t.stats?.day.value ?? null, change: t.stats && t.stats.day.prev != null ? t.stats.day.value - t.stats.day.prev : null }));
    const day = a.release ? Math.floor((last - Date.parse(a.release.slice(0, 10) + 'T00:00:00Z')) / 864e5) + 1 : null;
    return { name: a.name, day: day > 0 ? day : null, tracks, img: a.img };
  }).filter(s => s.tracks.length);
  // título: parte comum dos nomes (ex.: "EQUILIBRIVM" + "EQUILIBRIVM II")
  const names = secs.map(s => s.name);
  let common = names[0] || '';
  for (const n of names.slice(1)) { while (common && !n.toLowerCase().startsWith(common.toLowerCase())) common = common.slice(0, -1); }
  common = common.replace(/[\s:–-]+$/, '').trim();
  return { secs, title: secs.length > 1 ? (common.length >= 3 ? common : names.join(' + ')) : names[0], img: secs[0]?.img };
}
